<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你的內心怪獸 🎃</title>
    <style>
        :root {
            --bg-color: #0d0014;
            --text-color: #f0e6d2;
            --primary-color: #ff7300;
            --secondary-color: #8a2be2;
            --card-bg: rgba(25, 15, 38, 0.9);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            color: var(--primary-color);
            text-shadow: 0 0 10px rgba(255, 115, 0, 0.5);
            margin: 0 0 20px 0;
            text-align: center;
            font-size: 2.2rem;
        }
        
        /* 中央主要容器 */
        #stage-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        /* 鏡像相機區 */
        #cam-box {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #000;
            border: 3px solid var(--secondary-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.4);
            transition: all 0.5s ease;
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* 鏡像 */
        }

        /* 掃描動畫覆蓋層 */
        #scan-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
        }
        #scan-overlay.active {
            display: flex;
        }
        /* 雷射掃描線 */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--primary-color), #fff, var(--primary-color), transparent);
            box-shadow: 0 0 15px var(--primary-color);
            animation: scanMove 1.5s ease-in-out infinite alternate;
        }
        @keyframes scanMove {
            0% { top: 5%; }
            100% { top: 95%; }
        }
        .scan-countdown {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary-color);
            text-shadow: 0 0 20px #000;
            animation: pulse 0.5s infinite alternate;
        }

        /* 狀態提示字 */
        #status-text {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            color: var(--primary-color);
            white-space: nowrap;
        }

        /* 結果展示頁（掃描完成後顯示） */
        #result-box {
            display: none;
            width: 100%;
            background: var(--card-bg);
            border: 3px solid var(--primary-color);
            border-radius: 16px;
            padding: 20px;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 115, 0, 0.3);
            animation: fadeIn 0.6s ease-out forwards;
        }
        #result-box.show {
            display: flex;
        }

        /* 大圖呈現區 */
        .monster-image-container {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 4/3;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 15px rgba(255, 115, 0, 0.2);
            overflow: hidden;
            background: #111;
        }
        .monster-large-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .monster-large-emoji {
            font-size: 120px;
            line-height: 1;
        }

        /* 按鈕風格 */
        .btn {
            background: linear-gradient(135deg, var(--primary-color), #d05000);
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 115, 0, 0.4);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            max-width: 320px;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 115, 0, 0.6);
        }
        .btn:active:not(:disabled) {
            transform: translateY(1px);
        }
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.6;
        }
        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary-color), #5a189a);
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
        }
        
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            align-items: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        #message-box {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 51, 51, 0.9);
            padding: 15px 30px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            z-index: 100;
            display: none;
            text-align: center;
        }
        
        /* 除錯面板 */
        #debug-panel {
            position: fixed;
            top: 0; right: 0; bottom: 0;
            width: 280px;
            background: rgba(0, 0, 0, 0.85);
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            padding: 15px;
            overflow-y: auto;
            z-index: 50;
            display: none;
        }
    </style>
</head>
<body>

    <h1>你的內心怪獸 🎃</h1>
    <div id="message-box"></div>
    
    <div id="stage-container">
        <!-- 相機區 -->
        <div id="cam-box">
            <video id="webcam" autoplay playsinline></video>
            
            <!-- 掃描特效與倒數 -->
            <div id="scan-overlay">
                <div class="scan-line"></div>
                <div class="scan-countdown" id="scan-countdown">3</div>
            </div>
            
            <div id="status-text">相機初始化中...</div>
        </div>

        <!-- 偵測按鈕（初始狀態） -->
        <button id="scan-btn" class="btn" disabled>🔮 掃描我的內心怪獸</button>

        <!-- 結果頁面（掃描完成後替代相機出現） -->
        <div id="result-box">
            <div class="monster-image-container" id="monster-image-box">
                <!-- 動態填入大圖片或 Emoji -->
            </div>

            <div class="button-group">
                <button id="download-btn" class="btn">📸 下載怪獸結果卡片</button>
                <button id="retry-btn" class="btn btn-secondary">🔄 重新掃描</button>
            </div>
        </div>
    </div>

    <!-- 用於合成下載卡片的隱藏 Canvas -->
    <canvas id="export-canvas" style="display:none;"></canvas>
