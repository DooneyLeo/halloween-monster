<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>你的內心怪獸 🎃</title>
    <style>
        :root {
            --bg-color: #0d0014;
            --text-color: #f0e6d2;
            --primary-color: #ff7300;
            --secondary-color: #8a2be2;
            --card-bg: #190f26;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 12px 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        h1 {
            color: var(--primary-color);
            text-shadow: 0 0 12px rgba(255, 115, 0, 0.6);
            margin: 0 0 10px 0;
            text-align: center;
            font-size: 1.6rem;
        }
        
        #stage-container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            perspective: 1000px;
            position: relative;
        }
        
        /* 相機畫面區：佔比約 76~80vh */
        #cam-box {
            position: relative;
            width: 100%;
            height: 76vh;
            background: #000;
            border: 3px solid var(--secondary-color);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.4);
            user-select: none;
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        /* 連點掃描互動覆蓋層（只在鏡頭內點擊有效） */
        #scan-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.65);
            cursor: pointer;
            z-index: 10;
        }
        #scan-overlay.active {
            display: flex;
        }
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--primary-color), #fff, var(--primary-color), transparent);
            box-shadow: 0 0 15px var(--primary-color);
            animation: scanMove 1.5s ease-in-out infinite alternate;
            pointer-events: none;
        }
        @keyframes scanMove {
            0% { top: 5%; }
            100% { top: 95%; }
        }

        /* 5秒倒數與連點計次面板 */
        #energy-panel {
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            pointer-events: none;
        }
        .timer-display {
            font-size: 3.6rem;
            font-weight: 900;
            color: #ff3333;
            text-shadow: 0 0 20px rgba(255, 51, 51, 0.8), 0 0 5px #000;
            font-family: monospace;
            line-height: 1;
        }
        .tap-counter-box {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--primary-color);
            padding: 10px 24px;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(255, 115, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .tap-counter-title {
            font-size: 1.1rem;
            color: #fff;
            font-weight: bold;
        }
        .tap-count-text {
            font-size: 3.2rem;
            font-weight: 900;
            color: #ffff00;
            text-shadow: 0 0 15px #ff7300, 0 0 5px #000;
            font-family: monospace;
            line-height: 1;
        }
        .tap-subhint {
            font-size: 0.95rem;
            color: #ffcc80;
            background: rgba(0,0,0,0.6);
            padding: 4px 14px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
        }

        #status-text {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--primary-color);
            white-space: nowrap;
            pointer-events: none;
        }

        /* 下方控制區：輸入框與按鈕水平並列 */
        .controls-row {
            width: 100%;
            display: flex;
            flex-direction: row;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }
        #user-name-input {
            flex: 1;
            min-width: 0;
            padding: 12px 16px;
            border-radius: 25px;
            border: 2px solid var(--secondary-color);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }
        #user-name-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 12px rgba(255, 115, 0, 0.5);
            background: rgba(255, 255, 255, 0.15);
        }

        .btn {
            background: linear-gradient(135deg, var(--primary-color), #d05000);
            color: #fff;
            border: none;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 115, 0, 0.4);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 115, 0, 0.6);
        }
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.5;
            box-shadow: none;
        }
        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary-color), #5a189a);
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
        }

        /* 規則說明彈跳視窗 */
        #rules-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        #rules-modal.show {
            display: flex;
        }
        .modal-content {
            background: var(--card-bg);
            border: 3px solid var(--primary-color);
            border-radius: 20px;
            padding: 24px 20px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 0 30px rgba(255, 115, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: modalPop 0.3s ease-out;
        }
        @keyframes modalPop {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-title {
            color: var(--primary-color);
            font-size: 1.4rem;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 115, 0, 0.5);
            margin: 0;
        }
        .modal-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            color: #ddd;
            font-size: 0.98rem;
            line-height: 1.5;
            text-align: left;
            padding-left: 0;
            list-style: none;
            margin: 0;
        }
        .modal-list li {
            position: relative;
            padding-left: 26px;
        }
        .modal-list li::before {
            content: "🎃";
            position: absolute;
            left: 0;
            top: 1px;
        }
        .modal-list strong {
            color: #ff9d00;
        }
        .modal-btn-start {
            width: 100%;
            padding: 14px;
            font-size: 1.15rem;
            margin-top: 5px;
        }

        #result-box {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }
        #result-box.show {
            display: flex;
        }

        .monster-card {
            width: 100%;
            background: var(--card-bg);
            border: 3px solid var(--primary-color);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            box-shadow: 0 0 35px rgba(255, 115, 0, 0.4);
            transform-style: preserve-3d;
            backface-visibility: hidden;
            opacity: 0;
            overflow: hidden;
            position: relative;
        }

        .monster-card.animate-pop-flip {
            animation: cardPopFlip 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes cardPopFlip {
            0% {
                transform: scale(0.1) rotateY(0deg) rotateX(20deg);
                opacity: 0;
            }
            60% {
                transform: scale(1.08) rotateY(540deg) rotateX(0deg);
                opacity: 1;
            }
            85% {
                transform: scale(0.96) rotateY(720deg);
            }
            100% {
                transform: scale(1) rotateY(720deg);
                opacity: 1;
            }
        }

        .monster-image-container {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            border: 2px solid var(--secondary-color);
            overflow: hidden;
            background: #000;
        }
        .monster-large-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .monster-large-emoji {
            font-size: 100px;
            line-height: 1;
        }

        .card-info-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }
        .card-info-row {
            font-size: 1.1rem;
            color: #ddd;
            line-height: 1.4;
            word-break: break-word;
        }
        .card-info-row strong {
            color: var(--primary-color);
        }
        .highlight-name {
            color: #fff;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .highlight-monster {
            color: #ff9d00;
            font-weight: bold;
            font-size: 1.25rem;
        }
        .highlight-scare {
            color: #ffff00;
            font-weight: bold;
            font-size: 1.4rem;
            text-shadow: 0 0 10px rgba(255, 255, 0, 0.6);
            font-family: monospace;
        }
        .desc-text {
            font-style: italic;
            color: #f0e6d2;
            margin-top: 4px;
            padding-left: 10px;
            border-left: 3px solid var(--secondary-color);
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            align-items: center;
            margin-top: 18px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }
        .button-group.show {
            opacity: 1;
            pointer-events: auto;
        }

        #message-box {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 51, 51, 0.9);
            padding: 12px 24px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            z-index: 100;
            display: none;
            text-align: center;
        }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 9999;
            display: none;
        }
    </style>
</head>
<body>

    <h1 id="main-title">你的內心怪獸 🎃</h1>
    <div id="message-box"></div>
    
    <div id="stage-container">
        <!-- 相機畫面置中區 -->
        <div id="cam-box">
            <video id="webcam" autoplay playsinline muted></video>
            
            <!-- 5秒連點集氣互動層 -->
            <div id="scan-overlay">
                <div class="scan-line"></div>
                <div id="energy-panel">
                    <div class="timer-display" id="timer-display">5.0s</div>
                    <div class="tap-counter-box">
                        <div class="tap-counter-title">⚡ 鏡頭內瘋狂連點！</div>
                        <div class="tap-count-text" id="tap-count-text">0</div>
                    </div>
                    <div class="tap-subhint">手指點越快，怪獸嚇人指數越高！🔥</div>
                </div>
            </div>
            
            <div id="status-text">相機初始化中...</div>
        </div>

        <!-- 下方控制列：名字輸入與掃描按鈕水平並列 -->
        <div class="controls-row" id="controls-row">
            <input type="text" id="user-name-input" placeholder="✍️ 輸入怪獸宿主名字" maxlength="15" autocomplete="off">
            <button id="scan-btn" class="btn" disabled>🔮 開始注入能量</button>
        </div>

        <!-- 結果頁面：直式合成卡片與控制按鈕 -->
        <div id="result-box">
            <div class="monster-card" id="monster-card">
                <div class="monster-image-container" id="monster-image-box"></div>
                
                <div class="card-info-list">
                    <div class="card-info-row">
                        <strong>怪獸宿主：</strong><span id="res-user-name" class="highlight-name"></span>
                    </div>
                    <div class="card-info-row">
                        <strong>內心怪獸：</strong><span id="res-monster-name" class="highlight-monster"></span>
                    </div>
                    <div class="card-info-row">
                        <strong>嚇人指數：</strong><span id="res-scare-index" class="highlight-scare"></span>
                    </div>
                    <div class="card-info-row">
                        <strong>怪獸簡介：</strong>
                        <div id="res-monster-desc" class="desc-text"></div>
                    </div>
                </div>
            </div>

            <div class="button-group" id="button-group">
                <button id="download-btn" class="btn" style="width: 100%; max-width: 320px;">📸 下載怪獸結果卡片</button>
                <button id="reset-btn" class="btn btn-secondary" style="width: 100%; max-width: 320px;">🔄 不存檔 / 下一位挑戰</button>
            </div>
        </div>
    </div>

    <!-- 規則說明彈跳視窗 -->
    <div id="rules-modal">
        <div class="modal-content">
            <h3 class="modal-title">⚡ 怪獸能量挑戰說明 ⚡</h3>
            <ul class="modal-list">
                <li>你將有 <strong>5 秒</strong> 可以狂點注入怪獸能量，點擊越多次，這隻怪獸的嚇人指數就越高！</li>
                <li>滑鼠或手指必須放在<strong>攝影機鏡頭畫面區域內</strong>連點，才能成功累積次數。</li>
                <li>測驗結束後可自由選擇是否下載卡片；若點擊「不存檔」，系統<strong>不會進行任何儲存</strong>。</li>
            </ul>
            <button id="modal-start-btn" class="btn modal-btn-start">😈 我準備好了，開始 5 秒挑戰！</button>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>
    <canvas id="export-canvas" style="display:none;"></canvas>

    <script>
        const MONSTERS = [
            { 
                id: 'werewolf', 
                name: '綠毛狼人', 
                bgColor: '#4b3621', 
                imageUrl: './wolf.jpg', 
                soundUrl: './sounds/wolf.mp3',
                phrase: '「嗷嗚～今晚是滿月嗎？小心別惹我！」' 
            },
            { 
                id: 'frank', 
                name: '科學綠人', 
                bgColor: '#3a3b2a', 
                imageUrl: './frank.jpg', 
                soundUrl: './sounds/zombie.mp3',
                phrase: '「腦袋...我要吃腦袋...或是珍珠奶茶...」' 
            },
            { 
                id: 'vampire', 
                name: '吸血綠人', 
                bgColor: '#4a0e17', 
                imageUrl: './vampire.jpg', 
                soundUrl: './sounds/vampire.mp3',
                phrase: '「不吸血，只靠冰美式或拿鐵續命。」' 
            },
            { 
                id: 'ghost', 
                name: '驚嚇綠人', 
                bgColor: '#1a3320', 
                imageUrl: './ghost.jpg', 
                soundUrl: './sounds/ghost.mp3',
                phrase: '「你看不到我...你看不到我...」' 
            },
            { 
                id: 'pumpkin', 
                name: '萬聖南瓜王', 
                bgColor: '#1a3320', 
                imageUrl: './pumpkin.jpg', 
                soundUrl: './sounds/pumpkin.mp3',
                phrase: '「南瓜對身體很好，恭喜抽中全場大獎！」' 
            },
            { 
                id: 'wizard', 
                name: '魔法綠人', 
                bgColor: '#1a3320', 
                imageUrl: './wizard.jpg', 
                soundUrl: './sounds/wizard.mp3',
                phrase: '「登愣，我要把星期一變不見。」' 
            },
            { 
                id: 'mummy', 
                name: '繃帶綠人', 
                bgColor: '#1a3320', 
                imageUrl: './mummy.jpg', 
                soundUrl: './sounds/mummy.mp3',
                phrase: '「不要蓋住鼻子，我有過敏。」' 
            }
        ];

        let isCameraReady = false;
        let isChallenging = false;
        let tapCount = 0;
        let countdownTimer = null;
        let challengeEndTime = 0;
        let finalScareScore = 0;
        let finalMonsterResult = null;
        let currentUserName = '';

        let currentAudio = null;

        const video = document.getElementById("webcam");
        const camBox = document.getElementById("cam-box");
        const userNameInput = document.getElementById("user-name-input");
        const controlsRow = document.getElementById("controls-row");
        const scanBtn = document.getElementById("scan-btn");
        const scanOverlay = document.getElementById("scan-overlay");
        const timerDisplay = document.getElementById("timer-display");
        const tapCountText = document.getElementById("tap-count-text");
        const statusText = document.getElementById("status-text");
        const rulesModal = document.getElementById("rules-modal");
        const modalStartBtn = document.getElementById("modal-start-btn");
        const resultBox = document.getElementById("result-box");
        const monsterCard = document.getElementById("monster-card");
        const buttonGroup = document.getElementById("button-group");
        const resetBtn = document.getElementById("reset-btn");
        const downloadBtn = document.getElementById("download-btn");
        const messageBox = document.getElementById("message-box");
        const confettiCanvas = document.getElementById("confetti-canvas");

        function playMonsterMp3(monster) {
            if (!monster || !monster.soundUrl) return;
            try {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                }
                currentAudio = new Audio(monster.soundUrl);
                currentAudio.volume = 0.9;
                currentAudio.play().catch(err => {
                    console.log("音訊播放被瀏覽器阻擋或找不到檔案:", err);
                });
            } catch (e) {
                console.error("播放音效失敗:", e);
            }
        }

        let confettiAnimationId = null;
        function triggerConfetti() {
            confettiCanvas.style.display = 'block';
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
            const ctx = confettiCanvas.getContext('2d');
            
            const particles = [];
            const colors = ['#ff7300', '#ffd700', '#8a2be2', '#00ff88', '#ff0055', '#00d0ff'];

            for (let i = 0; i < 120; i++) {
                particles.push({
                    x: confettiCanvas.width / 2 + (Math.random() - 0.5) * 80,
                    y: confettiCanvas.height / 2 + (Math.random() - 0.5) * 80,
                    w: Math.random() * 12 + 6,
                    h: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: (Math.random() - 0.5) * 22,
                    vy: (Math.random() - 0.7) * 20 - 4,
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 10,
                    gravity: 0.38,
                    drag: 0.96,
                    opacity: 1
                });
            }

            let startTimestamp = Date.now();

            function render() {
                ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
                let alive = false;

                particles.forEach(p => {
                    p.vx *= p.drag;
                    p.vy = p.vy * p.drag + p.gravity;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.rotation += p.vRot;

                    if (Date.now() - startTimestamp > 2500) {
                        p.opacity -= 0.015;
                    }

                    if (p.opacity > 0 && p.y < confettiCanvas.height + 50) {
                        alive = true;
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate((p.rotation * Math.PI) / 180);
                        ctx.globalAlpha = Math.max(0, p.opacity);
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                        ctx.restore();
                    }
                });

                if (alive) {
                    confettiAnimationId = requestAnimationFrame(render);
                } else {
                    confettiCanvas.style.display = 'none';
                    cancelAnimationFrame(confettiAnimationId);
                }
            }

            cancelAnimationFrame(confettiAnimationId);
            render();
        }

        function updateScanBtnState() {
            const hasName = userNameInput.value.trim().length > 0;
            if (isCameraReady && hasName && !isChallenging) {
                scanBtn.disabled = false;
                statusText.innerText = "準備就緒，點擊右方按鈕！";
            } else if (isCameraReady && !hasName) {
                scanBtn.disabled = true;
                statusText.innerText = "請輸入名字後開始挑戰 ✍️";
            }
        }

        userNameInput.addEventListener("input", updateScanBtnState);

        async function initCamera() {
            try {
                statusText.innerText = "請求相機權限中... 📷";
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                } catch (err) {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                }
                
                video.srcObject = stream;
                await video.play();

                isCameraReady = true;
                updateScanBtnState();
            } catch (error) {
                console.error("相機開啟失敗:", error);
                messageBox.innerHTML = "無法開啟相機。<br>請確認瀏覽器支援相機並已允許授權。";
                messageBox.style.display = "block";
                statusText.innerText = "相機開啟失敗";
            }
        }

        // 點擊「開始注入能量」：彈出說明視窗
        scanBtn.addEventListener("click", () => {
            currentUserName = userNameInput.value.trim();
            if (!currentUserName || isChallenging || !isCameraReady) return;
            rulesModal.classList.add("show");
        });

        // 點擊彈窗的「開始挑戰」按鈕：啟動 5 秒倒數與連點
        modalStartBtn.addEventListener("click", () => {
            rulesModal.classList.remove("show");
            startEnergyChallenge();
        });

        function startEnergyChallenge() {
            isChallenging = true;
            tapCount = 0;
            tapCountText.innerText = '0';
            timerDisplay.innerText = '5.0s';
            
            controlsRow.style.display = 'none';
            statusText.innerText = "⚡ 請在鏡頭畫面內瘋狂連點！";
            scanOverlay.classList.add('active');

            const totalDuration = 5000;
            challengeEndTime = Date.now() + totalDuration;

            countdownTimer = setInterval(() => {
                const remaining = Math.max(0, challengeEndTime - Date.now());
                timerDisplay.innerText = (remaining / 1000).toFixed(1) + 's';

                if (remaining <= 0) {
                    clearInterval(countdownTimer);
                    isChallenging = false;
                    finishChallenge();
                }
            }, 60);
        }

        // 監聽鏡頭內的連點事件
        scanOverlay.addEventListener("pointerdown", (e) => {
            if (!isChallenging) return;
            e.preventDefault();

            tapCount++;
            tapCountText.innerText = tapCount;

            tapCountText.style.transform = 'scale(1.2)';
            setTimeout(() => { tapCountText.style.transform = 'scale(1)'; }, 60);
        });

        // 5秒結束：點幾下就是多少嚇人指數
        function finishChallenge() {
            scanOverlay.classList.remove('active');

            // 嚇人指數 = 點擊次數
            finalScareScore = tapCount;

            const randomIndex = Math.floor(Math.random() * MONSTERS.length);
            finalMonsterResult = MONSTERS[randomIndex];

            camBox.style.display = 'none';

            // 顯示卡片資訊（嚇人指數直接傳入數值）
            showResultCard(finalMonsterResult, currentUserName, finalScareScore);

            resultBox.classList.add('show');
            monsterCard.classList.add('animate-pop-flip');

            // 播放 MP3 配音
            playMonsterMp3(finalMonsterResult);

            // 南瓜王綵帶彩蛋
            if (finalMonsterResult.id === 'pumpkin') {
                setTimeout(triggerConfetti, 300);
            }

            setTimeout(() => {
                buttonGroup.classList.add('show');
            }, 1200);
        }

        function showResultCard(monster, userName, scareScore) {
            const imageBox = document.getElementById('monster-image-box');
            imageBox.style.borderColor = monster.bgColor || 'var(--primary-color)';

            if (monster.imageUrl && monster.imageUrl.trim() !== '') {
                imageBox.innerHTML = `
                    <img src="${monster.imageUrl}" 
                         class="monster-large-img" 
                         alt="${monster.name}" 
                         onerror="this.onerror=null; this.outerHTML='<div class=\\'monster-large-emoji\\'>🎃</div>';">
                `;
            } else {
                imageBox.innerHTML = `<div class="monster-large-emoji">🎃</div>`;
            }

            document.getElementById('res-user-name').innerText = userName;
            document.getElementById('res-monster-name').innerText = monster.name;
            document.getElementById('res-scare-index').innerText = scareScore;
            document.getElementById('res-monster-desc').innerText = monster.phrase;
        }

        // 不存檔 / 重置設施
        resetBtn.addEventListener("click", () => {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }

            monsterCard.classList.remove('animate-pop-flip');
            buttonGroup.classList.remove('show');
            resultBox.classList.remove('show');

            userNameInput.value = '';
            controlsRow.style.display = 'flex';
            camBox.style.display = 'block';
            
            updateScanBtnState();
        });

        // 選擇下載卡片：導出包含純數字「嚇人指數」的 PNG
        downloadBtn.addEventListener("click", async () => {
    if (!finalMonsterResult) return;

    const exportCanvas = document.getElementById('export-canvas');
    const ctx = exportCanvas.getContext('2d');
    
    exportCanvas.width = 600;
    exportCanvas.height = 920;

    // 1. 繪製卡片底色與內容
    ctx.fillStyle = "#190f26";
    ctx.fillRect(0, 0, 600, 920);

    ctx.strokeStyle = "#ff7300";
    ctx.lineWidth = 10;
    ctx.strokeRect(15, 15, 570, 890);

    ctx.fillStyle = "#ff7300";
    ctx.font = "bold 34px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("🎃 萬聖節內心怪獸卡 🎃", 300, 65);

    const imgContainer = document.querySelector('#monster-image-box img');
    if (imgContainer && imgContainer.complete) {
        ctx.drawImage(imgContainer, 50, 90, 500, 500);
    } else {
        ctx.fillStyle = "#000000";
        ctx.fillRect(50, 90, 500, 500);
        ctx.fillStyle = "#ffffff";
        ctx.font = "100px sans-serif";
        ctx.fillText("🎃", 300, 370);
    }
    ctx.strokeStyle = "#8a2be2";
    ctx.lineWidth = 4;
    ctx.strokeRect(50, 90, 500, 500);

    ctx.textAlign = "left";
    ctx.fillStyle = "#ff7300";
    ctx.font = "bold 24px sans-serif";
    ctx.fillText("怪獸宿主：", 50, 630);
    ctx.fillStyle = "#ffffff";
    ctx.font = "24px sans-serif";
    ctx.fillText(currentUserName, 180, 630);

    ctx.fillStyle = "#ff7300";
    ctx.font = "bold 24px sans-serif";
    ctx.fillText("內心怪獸：", 50, 675);
    ctx.fillStyle = "#ff9d00";
    ctx.font = "bold 26px sans-serif";
    ctx.fillText(finalMonsterResult.name, 180, 675);

    ctx.fillStyle = "#ff7300";
    ctx.font = "bold 24px sans-serif";
    ctx.fillText("嚇人指數：", 50, 720);
    ctx.fillStyle = "#ffff00";
    ctx.font = "bold 28px monospace";
    ctx.fillText(`${finalScareScore}`, 180, 720);

    ctx.fillStyle = "#ff7300";
    ctx.font = "bold 24px sans-serif";
    ctx.fillText("怪獸簡介：", 50, 765);
    ctx.fillStyle = "#f0e6d2";
    ctx.font = "italic 21px sans-serif";
    ctx.fillText(finalMonsterResult.phrase, 50, 805);

    ctx.fillStyle = "#8a2be2";
    ctx.font = "18px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("萬聖節特別企劃 — 內心怪獸測驗", 300, 875);

    // 2. 判斷是否為行動裝置，優先喚起原生相簿儲存面板
    exportCanvas.toBlob(async (blob) => {
        const fileName = `${currentUserName}-內心怪獸-${finalMonsterResult.name}.png`;
        const file = new File([blob], fileName, { type: "image/png" });

        // 如果手機支援 Web Share API 檔案分享
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
                await navigator.share({
                    files: [file],
                    title: '你的內心怪獸卡',
                    text: '快來看看我的萬聖節內心怪獸！'
                });
                return; // 成功呼叫分享面板（iPhone 點「儲存影像」即可存進相簿）
            } catch (err) {
                // 使用者自行按取消分享，不報錯
                if (err.name !== 'AbortError') {
                    console.log("分享失敗，改用備援方案:", err);
                }
            }
        }

        // 3. 備援方案：電腦端或未支援分享的瀏覽器直接觸發傳統下載
        const link = document.createElement('a');
        link.download = fileName;
        link.href = URL.createObjectURL(blob);
        link.click();
    }, 'image/png');
});

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initCamera);
        } else {
            initCamera();
        }
    </script>
</body>
</html>
