<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你的內心怪獸 🎃</title>
    <style>
        :root {
            --bg-color: #0d0014;
            --text-color: #f0e6d2;
            --primary-color: #ff7300;
            --secondary-color: #8a2be2;
            --card-bg: rgba(25, 15, 38, 0.9);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            color: var(--primary-color);
            text-shadow: 0 0 10px rgba(255, 115, 0, 0.5);
            margin: 0 0 20px 0;
            text-align: center;
            font-size: 2.2rem;
        }
        
        /* 中央主要容器 */
        #stage-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        /* 鏡像相機區 */
        #cam-box {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #000;
            border: 3px solid var(--secondary-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.4);
            transition: all 0.5s ease;
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* 鏡像 */
        }

        /* 掃描動畫覆蓋層 */
        #scan-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
        }
        #scan-overlay.active {
            display: flex;
        }
        /* 雷射掃描線 */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--primary-color), #fff, var(--primary-color), transparent);
            box-shadow: 0 0 15px var(--primary-color);
            animation: scanMove 1.5s ease-in-out infinite alternate;
        }
        @keyframes scanMove {
            0% { top: 5%; }
            100% { top: 95%; }
        }
        .scan-countdown {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary-color);
            text-shadow: 0 0 20px #000;
            animation: pulse 0.5s infinite alternate;
        }

        /* 狀態提示字 */
        #status-text {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            color: var(--primary-color);
            white-space: nowrap;
        }

        /* 結果展示頁（掃描完成後顯示） */
        #result-box {
            display: none;
            width: 100%;
            background: var(--card-bg);
            border: 3px solid var(--primary-color);
            border-radius: 16px;
            padding: 20px;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 115, 0, 0.3);
            animation: fadeIn 0.6s ease-out forwards;
        }
        #result-box.show {
            display: flex;
        }

        /* 大圖呈現區（4:3 比例展示） */
        .monster-image-container {
            width: 100%;
            max-width: 440px;
            aspect-ratio: 4/3;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            border: 3px solid var(--primary-color);
            box-shadow: 0 0 20px rgba(255, 115, 0, 0.3);
            overflow: hidden;
            background: #111;
        }
        .monster-large-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .monster-large-emoji {
            font-size: 110px;
            line-height: 1;
        }

        .monster-name {
            font-size: 2.2rem;
            font-weight: bold;
            color: #fff;
            margin: 5px 0 8px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .monster-phrase {
            font-size: 1.1rem;
            color: #ddd;
            font-style: italic;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        /* 按鈕風格 */
        .btn {
            background: linear-gradient(135deg, var(--primary-color), #d05000);
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 115, 0, 0.4);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            max-width: 320px;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 115, 0, 0.6);
        }
        .btn:active:not(:disabled) {
            transform: translateY(1px);
        }
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.6;
        }
        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary-color), #5a189a);
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
        }
        
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            align-items: center;
            margin-top: 5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        #message-box {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 51, 51, 0.9);
            padding: 15px 30px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            z-index: 100;
            display: none;
            text-align: center;
        }
        
        /* 除錯面板 */
        #debug-panel {
            position: fixed;
            top: 0; right: 0; bottom: 0;
            width: 280px;
            background: rgba(0, 0, 0, 0.85);
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            padding: 15px;
            overflow-y: auto;
            z-index: 50;
            display: none;
        }
    </style>
</head>
<body>

    <h1>你的內心怪獸 🎃</h1>
    <div id="message-box"></div>
    
    <div id="stage-container">
        <!-- 相機區 -->
        <div id="cam-box">
            <video id="webcam" autoplay playsinline></video>
            
            <!-- 掃描特效與倒數 -->
            <div id="scan-overlay">
                <div class="scan-line"></div>
                <div class="scan-countdown" id="scan-countdown">3</div>
            </div>
            
            <div id="status-text">相機初始化中...</div>
        </div>

        <!-- 偵測按鈕（初始狀態） -->
        <button id="scan-btn" class="btn" disabled>🔮 掃描我的內心怪獸</button>

        <!-- 結果頁面（掃描完成後替代相機出現） -->
        <div id="result-box">
            <div class="monster-image-container" id="monster-image-box">
                <!-- 動態填入大圖片或 Emoji -->
            </div>
            
            <div class="monster-name" id="result-name">怪獸名稱</div>
            <div class="monster-phrase" id="result-phrase">怪獸一句話台詞</div>

            <div class="button-group">
                <button id="download-btn" class="btn">📸 下載怪獸結果卡片</button>
                <button id="retry-btn" class="btn btn-secondary">🔄 重新掃描</button>
            </div>
        </div>
    </div>

    <!-- 用於合成下載卡片的隱藏 Canvas -->
    <canvas id="export-canvas" style="display:none;"></canvas>

    <div id="debug-panel"></div>

        let faceLandmarker;

        const video = document.getElementById("webcam");

        const downloadBtn = document.getElementById("download-btn");
        const debugPanel = document.getElementById("debug-panel");
        const messageBox = document.getElementById("message-box");

        const isDebugMode = new URLSearchParams(window.location.search).get('debug') === '1';
        if (isDebugMode) debugPanel.style.display = 'block';

        // ==========================================
        // 【初始化】（優先要求相機權限，確保立即跳出授權）
        // ==========================================
        async function init() {
    try {
        // 1. 優先請求相機權限
        statusText.innerText = "請求相機權限中... 📷";
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        video.srcObject = stream;

        // 2. 載入 MediaPipe AI 模型（改用 CPU 確保最高相容性）
        statusText.innerText = "正在載入 AI 模型中... ⏳";
        const filesetResolver = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/wasm");
        
        faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
            baseOptions: {
                modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
                delegate: "CPU" // 👈 改為 CPU，避免部分電腦 GPU 卡死
            },
            outputFaceBlendshapes: true,
            runningMode: "VIDEO",
            numFaces: 1
        });

        statusText.innerText = "請站到鏡頭前... 👀";
        video.addEventListener("loadeddata", predictWebcam);
    } catch (error) {
        console.error("初始化失敗:", error);
        messageBox.innerHTML = "無法開啟相機或載入模型。<br>錯誤細節: " + error.message;
        messageBox.style.display = "block";
        statusText.innerText = "載入失敗";
    }
});

                video.addEventListener("loadeddata", predictWebcam);
            } catch (error) {
                console.error("初始化失敗:", error);
                messageBox.innerHTML = "無法存取相機或載入 AI 模型。<br>錯誤細節: " + error.message;
                messageBox.style.display = "block";
                statusText.innerText = "初始化失敗";
            }
        }

        // ==========================================
        // 【即時辨識與特徵抽取】
        // ==========================================
        async function predictWebcam() {
            if (lastVideoTime !== video.currentTime) {
                lastVideoTime = video.currentTime;
                const results = faceLandmarker.detectForVideo(video, performance.now());
                
                if (results.faceBlendshapes && results.faceBlendshapes.length > 0) {
                    hasFaceDetected = true;
                    if (!isScanning) {
                        statusText.innerText = "準備就緒！請按下方按鈕開始掃描 🎃";
                        scanBtn.disabled = false;
                    }
                    
                    const features = extractFeatures(results);
                    const scores = calculateScores(features);

                    if (isScanning) {
                        sampledScoresList.push(scores);
                    }

                    if (isDebugMode) updateDebugPanel(scores, features);
                } else {
                    hasFaceDetected = false;
                    if (!isScanning) {
                        statusText.innerText = "請站到鏡頭前... 👀";
                        scanBtn.disabled = true;
                    }
                    if (isDebugMode) debugPanel.innerHTML = "<h3 style='color:red'>未偵測到人臉</h3>";
                }
            }
            window.requestAnimationFrame(predictWebcam);
        }

        function extractFeatures(results) {
            const blendshapes = results.faceBlendshapes[0].categories;
            const features = {};
            let totalActivity = 0;

            blendshapes.forEach(shape => {
                features[shape.categoryName] = shape.score;
                if (['jawOpen', 'mouthSmileLeft', 'mouthSmileRight', 'browDownLeft', 'browDownRight'].includes(shape.categoryName)) {
                    totalActivity += shape.score;
                }
            });

            let headTiltScore = 0;
            let rollDegrees = 0;
            if (results.faceLandmarks && results.faceLandmarks[0]) {
                const landmarks = results.faceLandmarks[0];
                const dx = landmarks[263].x - landmarks[33].x;
                const dy = landmarks[263].y - landmarks[33].y;
                rollDegrees = Math.atan2(dy, dx) * (180 / Math.PI);
                headTiltScore = Math.min(Math.abs(rollDegrees) / 18, 1.2);
            }
            features['_headTilt'] = headTiltScore;
            features['_rollDegrees'] = rollDegrees;
            features['_neutralFace'] = Math.max(0, 1.0 - (totalActivity + headTiltScore * 0.8));

            return features;
        }

        function calculateScores(features) {
            const scores = {};
            Object.values(CONFIG.monsters).forEach(m => {
                let s = 0;
                for (const [k, w] of Object.entries(m.weights)) {
                    s += (features[k] || 0) * w;
                }
                scores[m.id] = Math.max(0, s) + (Math.random() * 0.05);
            });
            return scores;
        }

        scanBtn.addEventListener("click", () => {

            scanCountdownEl.innerText = countdown;

                countdown--;
                if (countdown > 0) {
                    scanCountdownEl.innerText = countdown;
                } else {
                    clearInterval(timer);
                    finishScanningProcess();
                }
            }, 1000);
        }

        function finishScanningProcess() {
            isScanning = false;

            captureSnapshot();
            finalMonsterResult = computeWinningMonster();

            camBox.style.display = 'none';

        function captureSnapshot() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            capturedPhotoCanvas = canvas;
        }

        function computeWinningMonster() {
            const totals = {};
            Object.keys(CONFIG.monsters).forEach(id => totals[id] = 0);

            if (sampledScoresList.length > 0) {
                sampledScoresList.forEach(scores => {
                    Object.keys(scores).forEach(id => totals[id] += scores[id]);
                });
            }

            let winnerId = Object.keys(CONFIG.monsters)[0];
            let maxScore = -1;
            Object.entries(totals).forEach(([id, score]) => {
                if (score > maxScore) {
                    maxScore = score;
                    winnerId = id;
                }
            });

            return CONFIG.monsters[winnerId];
        }

        // 顯示結果卡片（支援大圖區呈現 Base64 圖片）
        function showResultCard(monster) {
            const imageBox = document.getElementById('monster-image-box');
            imageBox.style.borderColor = monster.bgColor || 'var(--primary-color)';

            if (monster.imageUrl && monster.imageUrl.trim() !== '') {
                imageBox.innerHTML = `<img src="${monster.imageUrl}" class="monster-large-img" alt="${monster.name}">`;
            } else {
                imageBox.innerHTML = `<div class="monster-large-emoji">${monster.emoji}</div>`;
            }

            document.getElementById('result-name').innerText = monster.name;
            document.getElementById('result-phrase').innerText = monster.phrase;

            resultBox.classList.add('show');
        }

        retryBtn.addEventListener("click", () => {
            resultBox.classList.remove('show');
            camBox.style.display = 'block';
            scanBtn.style.display = 'inline-flex';
            scanBtn.disabled = !hasFaceDetected;
            statusText.innerText = hasFaceDetected ? "準備就緒！請按下方按鈕開始掃描 🎃" : "請站到鏡頭前... 👀";
        });

        // ==========================================
        // 【下載卡片】
        // ==========================================
        downloadBtn.addEventListener("click", () => {
            if (!finalMonsterResult) return;

            const exportCanvas = document.getElementById('export-canvas');
            const ctx = exportCanvas.getContext('2d');
            
            exportCanvas.width = 600;
            exportCanvas.height = 800;

            ctx.fillStyle = "#0d0014";
            ctx.fillRect(0, 0, 600, 800);

            ctx.strokeStyle = "#ff7300";
            ctx.lineWidth = 10;
            ctx.strokeRect(15, 15, 570, 770);

            ctx.fillStyle = "#ff7300";
            ctx.font = "bold 36px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("🎃 你的內心怪獸 🎃", 300, 70);

            if (capturedPhotoCanvas) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(300, 240, 120, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();
                ctx.drawImage(capturedPhotoCanvas, 180, 120, 240, 240);
                ctx.restore();
                
                ctx.strokeStyle = "#8a2be2";
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(300, 240, 120, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 44px sans-serif";
            ctx.fillText(`${finalMonsterResult.emoji} ${finalMonsterResult.name}`, 300, 440);

            ctx.fillStyle = "#f0e6d2";
            ctx.font = "italic 22px sans-serif";
            ctx.fillText(finalMonsterResult.phrase, 300, 510);

            ctx.fillStyle = "#8a2be2";
            ctx.font = "18px sans-serif";
            ctx.fillText("萬聖節特別企劃 — 臉部辨識測驗", 300, 730);

            const link = document.createElement('a');
            link.download = `內心怪獸-${finalMonsterResult.name}.png`;
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
        });

        function updateDebugPanel(scores, features) {
            let html = `<h3>👾 即時得分</h3>`;
            Object.values(CONFIG.monsters).forEach(m => {
                const score = scores[m.id].toFixed(2);
                html += `<div>${m.name}: ${score}</div>`;
            });
            html += `<hr><h3>🎭 特徵</h3>`;
            html += `<div>張嘴 (jawOpen): ${(features['jawOpen']||0).toFixed(2)}</div>`;
            html += `<div>歪頭 (Roll): ${features['_rollDegrees'].toFixed(1)}°</div>`;
            html += `<div>面無表情: ${features['_neutralFace'].toFixed(2)}</div>`;
            debugPanel.innerHTML = html;
        }

        // 頁面載入完成後執行 init
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
