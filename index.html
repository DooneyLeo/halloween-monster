<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你的內心怪獸 🎃</title>
    <style>
        :root {
            --bg-color: #0d0014;
            --text-color: #f0e6d2;
            --primary-color: #ff7300;
            --secondary-color: #8a2be2;
            --card-bg: #190f26;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 12px 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        h1 {
            color: var(--primary-color);
            text-shadow: 0 0 12px rgba(255, 115, 0, 0.6);
            margin: 0 0 10px 0;
            text-align: center;
            font-size: 1.6rem;
        }
        
        #stage-container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            perspective: 1000px;
        }
        
        /* 相機畫面區：佔比約 78~80% 視窗高度 */
        #cam-box {
            position: relative;
            width: 100%;
            height: 76vh;
            background: #000;
            border: 3px solid var(--secondary-color);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.4);
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #scan-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
        }
        #scan-overlay.active {
            display: flex;
        }
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--primary-color), #fff, var(--primary-color), transparent);
            box-shadow: 0 0 15px var(--primary-color);
            animation: scanMove 1.5s ease-in-out infinite alternate;
        }
        @keyframes scanMove {
            0% { top: 5%; }
            100% { top: 95%; }
        }
        .scan-countdown {
            font-size: 4rem;
            font-weight: bold;
            color: var(--primary-color);
            text-shadow: 0 0 20px #000;
            animation: pulse 0.5s infinite alternate;
        }

        #status-text {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--primary-color);
            white-space: nowrap;
        }

        /* 下方控制區：輸入框與按鈕水平並列 */
        .controls-row {
            width: 100%;
            display: flex;
            flex-direction: row;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }
        #user-name-input {
            flex: 1;
            min-width: 0;
            padding: 12px 16px;
            border-radius: 25px;
            border: 2px solid var(--secondary-color);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }
        #user-name-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 12px rgba(255, 115, 0, 0.5);
            background: rgba(255, 255, 255, 0.15);
        }

        .btn {
            background: linear-gradient(135deg, var(--primary-color), #d05000);
            color: #fff;
            border: none;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 115, 0, 0.4);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 115, 0, 0.6);
        }
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.5;
            box-shadow: none;
        }
        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary-color), #5a189a);
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
        }

        #result-box {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }
        #result-box.show {
            display: flex;
        }

        .monster-card {
            width: 100%;
            background: var(--card-bg);
            border: 3px solid var(--primary-color);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            box-shadow: 0 0 35px rgba(255, 115, 0, 0.4);
            transform-style: preserve-3d;
            backface-visibility: hidden;
            opacity: 0;
            overflow: hidden;
        }

        .monster-card.animate-pop-flip {
            animation: cardPopFlip 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes cardPopFlip {
            0% {
                transform: scale(0.1) rotateY(0deg) rotateX(20deg);
                opacity: 0;
            }
            60% {
                transform: scale(1.08) rotateY(540deg) rotateX(0deg);
                opacity: 1;
            }
            85% {
                transform: scale(0.96) rotateY(720deg);
            }
            100% {
                transform: scale(1) rotateY(720deg);
                opacity: 1;
            }
        }

        .monster-image-container {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            border: 2px solid var(--secondary-color);
            overflow: hidden;
            background: #000;
        }
        .monster-large-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .monster-large-emoji {
            font-size: 100px;
            line-height: 1;
        }

        .card-info-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }
        .card-info-row {
            font-size: 1.1rem;
            color: #ddd;
            line-height: 1.4;
            word-break: break-word;
        }
        .card-info-row strong {
            color: var(--primary-color);
        }
        .highlight-name {
            color: #fff;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .highlight-monster {
            color: #ff9d00;
            font-weight: bold;
            font-size: 1.25rem;
        }
        .desc-text {
            font-style: italic;
            color: #f0e6d2;
            margin-top: 4px;
            padding-left: 10px;
            border-left: 3px solid var(--secondary-color);
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            align-items: center;
            margin-top: 18px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }
        .button-group.show {
            opacity: 1;
            pointer-events: auto;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        #message-box {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 51, 51, 0.9);
            padding: 12px 24px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            z-index: 100;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1 id="main-title">你的內心怪獸 🎃</h1>
    <div id="message-box"></div>
    
    <div id="stage-container">
        <div id="cam-box">
            <video id="webcam" autoplay playsinline muted></video>
            
            <div id="scan-overlay">
                <div class="scan-line"></div>
                <div class="scan-countdown" id="scan-countdown">3</div>
            </div>
            
            <div id="status-text">相機初始化中...</div>
        </div>

        <div class="controls-row" id="controls-row">
            <input type="text" id="user-name-input" placeholder="✍️ 輸入怪獸宿主名字" maxlength="15" autocomplete="off">
            <button id="scan-btn" class="btn" disabled>🔮 開始掃描</button>
        </div>

        <div id="result-box">
            <div class="monster-card" id="monster-card">
                <div class="monster-image-container" id="monster-image-box"></div>
                
                <div class="card-info-list">
                    <div class="card-info-row">
                        <strong>怪獸宿主：</strong><span id="res-user-name" class="highlight-name"></span>
                    </div>
                    <div class="card-info-row">
                        <strong>內心怪獸：</strong><span id="res-monster-name" class="highlight-monster"></span>
                    </div>
                    <div class="card-info-row">
                        <strong>怪獸簡介：</strong>
                        <div id="res-monster-desc" class="desc-text"></div>
                    </div>
                </div>
            </div>

            <div class="button-group" id="button-group">
                <button id="download-btn" class="btn" style="width: 100%; max-width: 320px;">📸 下載怪獸結果卡片</button>
                <button id="reset-btn" class="btn btn-secondary" style="width: 100%; max-width: 320px;">🔄 重置設施（下一位）</button>
            </div>
        </div>
    </div>

    <canvas id="export-canvas" style="display:none;"></canvas>

    <script>
        const MONSTERS = [
            { 
                id: 'werewolf', 
                name: '綠毛狼人', 
                bgColor: '#4b3621', 
                imageUrl: './wolf.jpg', 
                phrase: '「嗷嗚～今晚是滿月嗎？小心別惹我！」' 
            },
            { 
                id: 'frank', 
                name: '科學綠人', 
                bgColor: '#3a3b2a', 
                imageUrl: './frank.jpg', 
                phrase: '「腦袋...我要吃腦袋...或是珍珠奶茶...」' 
            },
            { 
                id: 'vampire', 
                name: '吸血綠人', 
                bgColor: '#4a0e17', 
                imageUrl: './vampire.jpg', 
                phrase: '「不吸血，只靠冰美式或拿鐵續命。」' 
            },
            { 
                id: 'ghost', 
                name: '驚嚇綠人', 
                bgColor: '#1a3320', 
                imageUrl: './ghost.jpg', 
                phrase: '「你看不到我...你看不到我...」' 
            },
            { 
                id: 'pumpkin', 
                name: '萬聖南瓜王', 
                bgColor: '#1a3320', 
                imageUrl: './pumpkin.jpg', 
                phrase: '「南瓜對身體很好，不要討厭我。」' 
            },
            { 
                id: 'wizard', 
                name: '魔法綠人', 
                bgColor: '#1a3320', 
                imageUrl: './wizard.jpg', 
                phrase: '「登愣，我要把星期一變不見。」' 
            },
            { 
                id: 'mummy', 
                name: '繃帶綠人', 
                bgColor: '#1a3320', 
                imageUrl: './mummy.jpg', 
                phrase: '「不要蓋住鼻子，我有過敏。」' 
            }
        ];

        let isCameraReady = false;
        let isScanning = false;
        let finalMonsterResult = null;
        let currentUserName = '';

        const video = document.getElementById("webcam");
        const camBox = document.getElementById("cam-box");
        const userNameInput = document.getElementById("user-name-input");
        const controlsRow = document.getElementById("controls-row");
        const scanBtn = document.getElementById("scan-btn");
        const scanOverlay = document.getElementById("scan-overlay");
        const scanCountdownEl = document.getElementById("scan-countdown");
        const statusText = document.getElementById("status-text");
        const resultBox = document.getElementById("result-box");
        const monsterCard = document.getElementById("monster-card");
        const buttonGroup = document.getElementById("button-group");
        const resetBtn = document.getElementById("reset-btn");
        const downloadBtn = document.getElementById("download-btn");
        const messageBox = document.getElementById("message-box");

        function updateScanBtnState() {
            const hasName = userNameInput.value.trim().length > 0;
            if (isCameraReady && hasName && !isScanning) {
                scanBtn.disabled = false;
                statusText.innerText = "準備就緒，點擊右方按鈕！";
            } else if (isCameraReady && !hasName) {
                scanBtn.disabled = true;
                statusText.innerText = "請輸入名字後開始掃描 ✍️";
            }
        }

        userNameInput.addEventListener("input", updateScanBtnState);

        // 修復：完整的相機初始化與備援邏輯
        async function initCamera() {
            try {
                statusText.innerText = "請求相機權限中... 📷";
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                } catch (err) {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                }
                
                video.srcObject = stream;
                await video.play();

                isCameraReady = true;
                updateScanBtnState();
            } catch (error) {
                console.error("相機開啟失敗:", error);
                messageBox.innerHTML = "無法開啟相機。<br>請確認瀏覽器支援相機並已允許授權。";
                messageBox.style.display = "block";
                statusText.innerText = "相機開啟失敗";
            }
        }

        scanBtn.addEventListener("click", () => {
            currentUserName = userNameInput.value.trim();
            if (!currentUserName || isScanning || !isCameraReady) return;
            
            isScanning = true;
            controlsRow.style.display = 'none';
            statusText.innerText = "正在分析你的內心怪獸...";
            scanOverlay.classList.add('active');

            let countdown = 3;
            scanCountdownEl.innerText = countdown;

            const timer = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    scanCountdownEl.innerText = countdown;
                } else {
                    clearInterval(timer);
                    finishScan();
                }
            }, 1000);
        });

        function finishScan() {
            isScanning = false;
            scanOverlay.classList.remove('active');

            const randomIndex = Math.floor(Math.random() * MONSTERS.length);
            finalMonsterResult = MONSTERS[randomIndex];

            camBox.style.display = 'none';

            showResultCard(finalMonsterResult, currentUserName);

            resultBox.classList.add('show');
            monsterCard.classList.add('animate-pop-flip');

            setTimeout(() => {
                buttonGroup.classList.add('show');
            }, 1200);
        }

        function showResultCard(monster, userName) {
            const imageBox = document.getElementById('monster-image-box');
            imageBox.style.borderColor = monster.bgColor || 'var(--primary-color)';

            if (monster.imageUrl && monster.imageUrl.trim() !== '') {
                imageBox.innerHTML = `
                    <img src="${monster.imageUrl}" 
                         class="monster-large-img" 
                         alt="${monster.name}" 
                         onerror="this.onerror=null; this.outerHTML='<div class=\\'monster-large-emoji\\'>🎃</div>';">
                `;
            } else {
                imageBox.innerHTML = `<div class="monster-large-emoji">🎃</div>`;
            }

            document.getElementById('res-user-name').innerText = userName;
            document.getElementById('res-monster-name').innerText = monster.name;
            document.getElementById('res-monster-desc').innerText = monster.phrase;
        }

        resetBtn.addEventListener("click", () => {
            monsterCard.classList.remove('animate-pop-flip');
            buttonGroup.classList.remove('show');
            resultBox.classList.remove('show');

            userNameInput.value = '';
            controlsRow.style.display = 'flex';
            camBox.style.display = 'block';
            
            updateScanBtnState();
        });

        downloadBtn.addEventListener("click", () => {
            if (!finalMonsterResult) return;

            const exportCanvas = document.getElementById('export-canvas');
            const ctx = exportCanvas.getContext('2d');
            
            exportCanvas.width = 600;
            exportCanvas.height = 900;

            ctx.fillStyle = "#190f26";
            ctx.fillRect(0, 0, 600, 900);

            ctx.strokeStyle = "#ff7300";
            ctx.lineWidth = 10;
            ctx.strokeRect(15, 15, 570, 870);

            ctx.fillStyle = "#ff7300";
            ctx.font = "bold 34px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("🎃 萬聖節內心怪獸卡 🎃", 300, 65);

            const imgContainer = document.querySelector('#monster-image-box img');
            if (imgContainer && imgContainer.complete) {
                ctx.drawImage(imgContainer, 50, 90, 500, 500);
            } else {
                ctx.fillStyle = "#000000";
                ctx.fillRect(50, 90, 500, 500);
                ctx.fillStyle = "#ffffff";
                ctx.font = "100px sans-serif";
                ctx.fillText("🎃", 300, 370);
            }
            ctx.strokeStyle = "#8a2be2";
            ctx.lineWidth = 4;
            ctx.strokeRect(50, 90, 500, 500);

            ctx.textAlign = "left";
            
            ctx.fillStyle = "#ff7300";
            ctx.font = "bold 26px sans-serif";
            ctx.fillText("怪獸宿主：", 50, 630);
            ctx.fillStyle = "#ffffff";
            ctx.font = "26px sans-serif";
            ctx.fillText(currentUserName, 200, 630);

            ctx.fillStyle = "#ff7300";
            ctx.font = "bold 26px sans-serif";
            ctx.fillText("內心怪獸：", 50, 680);
            ctx.fillStyle = "#ff9d00";
            ctx.font = "bold 28px sans-serif";
            ctx.fillText(finalMonsterResult.name, 200, 680);

            ctx.fillStyle = "#ff7300";
            ctx.font = "bold 26px sans-serif";
            ctx.fillText("怪獸簡介：", 50, 730);
            ctx.fillStyle = "#f0e6d2";
            ctx.font = "italic 22px sans-serif";
            ctx.fillText(finalMonsterResult.phrase, 50, 770);

            ctx.fillStyle = "#8a2be2";
            ctx.font = "18px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("萬聖節特別企劃 — 內心怪獸測驗", 300, 850);

            const link = document.createElement('a');
            link.download = `${currentUserName}-內心怪獸-${finalMonsterResult.name}.png`;
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
        });

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initCamera);
        } else {
            initCamera();
        }
    </script>
</body>
</html>
