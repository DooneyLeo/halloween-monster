<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你的內心怪獸 🎃</title>
    <style>
        :root {
            --bg-color: #0d0014;
            --text-color: #f0e6d2;
            --primary-color: #ff7300;
            --secondary-color: #8a2be2;
            --card-bg: rgba(25, 15, 38, 0.95);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            color: var(--primary-color);
            text-shadow: 0 0 10px rgba(255, 115, 0, 0.5);
            margin: 0 0 20px 0;
            text-align: center;
            font-size: 2.2rem;
        }
        
        /* 置中主要舞台區 */
        #stage-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        /* 步驟 1: 相機框框置中 */
        #cam-box {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #000;
            border: 3px solid var(--secondary-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.4);
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* 鏡像 */
        }

        /* 步驟 2: 掃描特效與倒數覆蓋層 */
        #scan-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
        }
        #scan-overlay.active {
            display: flex;
        }
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--primary-color), #fff, var(--primary-color), transparent);
            box-shadow: 0 0 15px var(--primary-color);
            animation: scanMove 1.5s ease-in-out infinite alternate;
        }
        @keyframes scanMove {
            0% { top: 5%; }
            100% { top: 95%; }
        }
        .scan-countdown {
            font-size: 4rem;
            font-weight: bold;
            color: var(--primary-color);
            text-shadow: 0 0 20px #000;
            animation: pulse 0.5s infinite alternate;
        }

        #status-text {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            color: var(--primary-color);
            white-space: nowrap;
        }

        /* 步驟 3: 結果卡片替代相機區 */
        #result-box {
            display: none;
            width: 100%;
            background: var(--card-bg);
            border: 3px solid var(--primary-color);
            border-radius: 16px;
            padding: 20px;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 115, 0, 0.3);
            animation: fadeIn 0.5s ease-out forwards;
        }
        #result-box.show {
            display: flex;
        }

        .monster-image-container {
            width: 100%;
            max-width: 440px;
            aspect-ratio: 4/3;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            border: 3px solid var(--primary-color);
            box-shadow: 0 0 20px rgba(255, 115, 0, 0.3);
            overflow: hidden;
            background: #111;
        }
        .monster-large-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .monster-large-emoji {
            font-size: 110px;
            line-height: 1;
        }

        .monster-name {
            font-size: 2.2rem;
            font-weight: bold;
            color: #fff;
            margin: 5px 0 8px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .monster-phrase {
            font-size: 1.1rem;
            color: #ddd;
            font-style: italic;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        /* 通用按鈕樣式 */
        .btn {
            background: linear-gradient(135deg, var(--primary-color), #d05000);
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 115, 0, 0.4);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            max-width: 320px;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 115, 0, 0.6);
        }
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary-color), #5a189a);
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
        }
        
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            align-items: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        #message-box {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 51, 51, 0.9);
            padding: 15px 30px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            z-index: 100;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>你的內心怪獸 🎃</h1>
    <div id="message-box"></div>
    
    <div id="stage-container">
        <!-- 步驟 1: 相機畫面置中區 -->
        <div id="cam-box">
            <video id="webcam" autoplay playsinline></video>
            
            <!-- 步驟 2: 掃描動畫覆蓋層 -->
            <div id="scan-overlay">
                <div class="scan-line"></div>
                <div class="scan-countdown" id="scan-countdown">3</div>
            </div>
            
            <div id="status-text">相機初始化中...</div>
        </div>

        <!-- 步驟 1: 置於相機下方的掃描按鈕 -->
        <button id="scan-btn" class="btn" disabled>🔮 開始掃描萬聖怪獸</button>

        <!-- 步驟 3: 結果卡片區（觸發後替換相機顯示） -->
        <div id="result-box">
            <div class="monster-image-container" id="monster-image-box"></div>
            
            <div class="monster-name" id="result-name">怪獸名稱</div>
            <div class="monster-phrase" id="result-phrase">怪獸台詞</div>

            <div class="button-group">
                <button id="download-btn" class="btn">📸 下載怪獸結果卡片</button>
                <!-- 步驟 4: 重置設施按鈕，叫回相機視窗 -->
                <button id="reset-btn" class="btn btn-secondary">🔄 重置設施（下一位）</button>
            </div>
        </div>
    </div>

    <!-- 用於合成下載卡片的隱藏 Canvas -->
    <canvas id="export-canvas" style="display:none;"></canvas>

    <script>
        // 怪獸資料庫（圖片預設讀取同目錄下的圖片檔）
        const MONSTERS = [
            { 
                id: 'werewolf', 
                name: '狂暴狼人', 
                emoji: '🐺', 
                bgColor: '#4b3621', 
                imageUrl: './frank.jpg', 
                phrase: '「嗷嗚～今晚是滿月嗎？小心別惹我！」' 
            },
            { 
                id: 'zombie', 
                name: '茫然殭屍', 
                emoji: '🧟', 
                bgColor: '#3a3b2a', 
                imageUrl: './frank.jpg', 
                phrase: '「腦袋...我要吃腦袋...或是珍珠奶茶...」' 
            },
            { 
                id: 'vampire', 
                name: '高雅吸血鬼', 
                emoji: '🧛', 
                bgColor: '#4a0e17', 
                imageUrl: './frank.jpg', 
                phrase: '「今夜的月色真美，要來一杯新鮮番茄汁嗎？」' 
            },
            { 
                id: 'frankenstein', 
                name: '科學怪人', 
                emoji: '🧟‍♂️', 
                bgColor: '#1a3320', 
                imageUrl: './frank.jpg', 
                phrase: '「雷電...賜予我力量！我只是頭有點歪而已。」' 
            }
        ];

        let isScanning = false;
        let finalMonsterResult = null;
        let capturedPhotoCanvas = null;

        const video = document.getElementById("webcam");
        const camBox = document.getElementById("cam-box");
        const scanBtn = document.getElementById("scan-btn");
        const scanOverlay = document.getElementById("scan-overlay");
        const scanCountdownEl = document.getElementById("scan-countdown");
        const statusText = document.getElementById("status-text");
        const resultBox = document.getElementById("result-box");
        const resetBtn = document.getElementById("reset-btn");
        const downloadBtn = document.getElementById("download-btn");
        const messageBox = document.getElementById("message-box");

        // 【步驟 1】開啟相機並使掃描按鈕可用
        async function initCamera() {
            try {
                statusText.innerText = "請求相機權限中... 📷";
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;
                
                video.addEventListener("loadeddata", () => {
                    statusText.innerText = "相機就緒，請點擊下方按鈕";
                    scanBtn.disabled = false;
                });
            } catch (error) {
                console.error("相機開啟失敗:", error);
                messageBox.innerHTML = "無法開啟相機。<br>請確認裝置擁有相機並允許存取。";
                messageBox.style.display = "block";
                statusText.innerText = "相機開啟失敗";
            }
        }

        // 【步驟 2】點擊掃描按鈕觸發 3 秒雷射倒數動畫
        scanBtn.addEventListener("click", () => {
            if (isScanning) return;
            
            isScanning = true;
            scanBtn.disabled = true;
            scanBtn.style.display = 'none';
            statusText.innerText = "正在分析你的內心怪獸...";
            scanOverlay.classList.add('active');

            let countdown = 3;
            scanCountdownEl.innerText = countdown;

            const timer = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    scanCountdownEl.innerText = countdown;
                } else {
                    clearInterval(timer);
                    finishScan();
                }
            }, 1000);
        });

        // 【步驟 3】掃描完成：擷取照片，隨機選怪獸並隱藏相機框顯示結果 UI
        function finishScan() {
            isScanning = false;
            scanOverlay.classList.remove('active');

            // 擷取當前鏡頭照片作為下載卡片背景
            captureSnapshot();

            // 隨機抽選怪獸
            const randomIndex = Math.floor(Math.random() * MONSTERS.length);
            finalMonsterResult = MONSTERS[randomIndex];

            // 隱藏相機框與按鈕，顯示結果頁
            camBox.style.display = 'none';
            showResultCard(finalMonsterResult);
        }

        function captureSnapshot() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            capturedPhotoCanvas = canvas;
        }

        function showResultCard(monster) {
            const imageBox = document.getElementById('monster-image-box');
            imageBox.style.borderColor = monster.bgColor || 'var(--primary-color)';

            if (monster.imageUrl && monster.imageUrl.trim() !== '') {
                // 如果圖片連結失效或破圖，自動降級顯示 Emoji
                imageBox.innerHTML = `
                    <img src="${monster.imageUrl}" 
                         class="monster-large-img" 
                         alt="${monster.name}" 
                         onerror="this.onerror=null; this.outerHTML='<div class=\\'monster-large-emoji\\'>${monster.emoji}</div>';">
                `;
            } else {
                imageBox.innerHTML = `<div class="monster-large-emoji">${monster.emoji}</div>`;
            }

            document.getElementById('result-name').innerText = monster.name;
            document.getElementById('result-phrase').innerText = monster.phrase;

            resultBox.classList.add('show');
        }

        // 【步驟 4】重置設施：隱藏結果，恢復相機框框，供下一位體驗
        resetBtn.addEventListener("click", () => {
            resultBox.classList.remove('show');
            camBox.style.display = 'block';
            scanBtn.style.display = 'inline-flex';
            scanBtn.disabled = false;
            statusText.innerText = "相機就緒，請點擊下方按鈕";
        });

        // 合成圖片與下載功能
        downloadBtn.addEventListener("click", () => {
            if (!finalMonsterResult) return;

            const exportCanvas = document.getElementById('export-canvas');
            const ctx = exportCanvas.getContext('2d');
            
            exportCanvas.width = 600;
            exportCanvas.height = 800;

            ctx.fillStyle = "#0d0014";
            ctx.fillRect(0, 0, 600, 800);

            ctx.strokeStyle = "#ff7300";
            ctx.lineWidth = 10;
            ctx.strokeRect(15, 15, 570, 770);

            ctx.fillStyle = "#ff7300";
            ctx.font = "bold 36px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("🎃 你的內心怪獸 🎃", 300, 70);

            if (capturedPhotoCanvas) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(300, 240, 120, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();
                ctx.drawImage(capturedPhotoCanvas, 180, 120, 240, 240);
                ctx.restore();
                
                ctx.strokeStyle = "#8a2be2";
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(300, 240, 120, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 44px sans-serif";
            ctx.fillText(`${finalMonsterResult.emoji} ${finalMonsterResult.name}`, 300, 440);

            ctx.fillStyle = "#f0e6d2";
            ctx.font = "italic 22px sans-serif";
            ctx.fillText(finalMonsterResult.phrase, 300, 510);

            ctx.fillStyle = "#8a2be2";
            ctx.font = "18px sans-serif";
            ctx.fillText("萬聖節特別企劃 — 內心怪獸測驗", 300, 730);

            const link = document.createElement('a');
            link.download = `內心怪獸-${finalMonsterResult.name}.png`;
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
        });

        // 啟動相機控制
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initCamera);
        } else {
            initCamera();
        }
    </script>
</body>
</html>
