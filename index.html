<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>你的內心怪獸 🎃</title>
    <style>
        :root {
            --bg-color: #0d0014;
            --text-color: #f0e6d2;
            --primary-color: #ff7300;
            --secondary-color: #8a2be2;
            --card-bg: #190f26;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 12px 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        h1 {
            color: var(--primary-color);
            text-shadow: 0 0 12px rgba(255, 115, 0, 0.6);
            margin: 0 0 10px 0;
            text-align: center;
            font-size: 1.6rem;
        }
        
        #stage-container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            perspective: 1000px;
            position: relative;
        }
        
        /* 1. 相機畫面區：佔比約 76~80vh */
        #cam-box {
            position: relative;
            width: 100%;
            height: 76vh;
            background: #000;
            border: 3px solid var(--secondary-color);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.4);
            user-select: none;
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        /* 5秒連點集氣互動層（僅在鏡頭框內點擊有效） */
        #scan-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.65);
            cursor: pointer;
            z-index: 10;
        }
        #scan-overlay.active {
            display: flex;
        }
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--primary-color), #fff, var(--primary-color), transparent);
            box-shadow: 0 0 15px var(--primary-color);
            animation: scanMove 1.5s ease-in-out infinite alternate;
            pointer-events: none;
        }
        @keyframes scanMove {
            0% { top: 5%; }
            100% { top: 95%; }
        }

        #energy-panel {
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            pointer-events: none;
        }
        .timer-display {
            font-size: 3.6rem;
            font-weight: 900;
            color: #ff3333;
            text-shadow: 0 0 20px rgba(255, 51, 51, 0.8), 0 0 5px #000;
            font-family: monospace;
            line-height: 1;
        }
        .tap-counter-box {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--primary-color);
            padding: 10px 24px;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(255, 115, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .tap-counter-title {
            font-size: 1.1rem;
            color: #fff;
            font-weight: bold;
        }
        .tap-count-text {
            font-size: 3.2rem;
            font-weight: 900;
            color: #ffff00;
            text-shadow: 0 0 15px #ff7300, 0 0 5px #000;
            font-family: monospace;
            line-height: 1;
        }
        .tap-subhint {
            font-size: 0.95rem;
            color: #ffcc80;
            background: rgba(0,0,0,0.6);
            padding: 4px 14px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
        }

        #status-text {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--primary-color);
            white-space: nowrap;
            pointer-events: none;
        }

        /* 2. 下方控制區：輸入框與按鈕水平並列 */
        .controls-row {
            width: 100%;
            display: flex;
            flex-direction: row;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }
        #user-name-input {
            flex: 1;
            min-width: 0;
            padding: 12px 16px;
            border-radius: 25px;
            border: 2px solid var(--secondary-color);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }
        #user-name-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 12px rgba(255, 115, 0, 0.5);
            background: rgba(255, 255, 255, 0.15);
        }

        .btn {
            background: linear-gradient(135deg, var(--primary-color), #d05000);
            color: #fff;
            border: none;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 115, 0, 0.4);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 115, 0, 0.6);
        }
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.5;
            box-shadow: none;
        }
        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary-color), #5a189a);
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
        }

        /* 規則說明彈跳視窗 */
        #rules-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        #rules-modal.show {
            display: flex;
        }
        .modal-content {
            background: var(--card-bg);
            border: 3px solid var(--primary-color);
            border-radius: 20px;
            padding: 24px 20px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 0 30px rgba(255, 115, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: modalPop 0.3s ease-out;
        }
        @keyframes modalPop {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-title {
            color: var(--primary-color);
            font-size: 1.4rem;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 115, 0, 0.5);
            margin: 0;
        }
        .modal-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            color: #ddd;
            font-size: 0.98rem;
            line-height: 1.5;
            text-align: left;
            padding-left: 0;
            list-style: none;
            margin: 0;
        }
        .modal-list li {
            position: relative;
            padding-left: 26px;
        }
        .modal-list li::before {
            content: "🎃";
            position: absolute;
            left: 0;
            top: 1px;
        }
        .modal-list strong {
            color: #ff9d00;
        }
        .modal-btn-start {
            width: 100%;
            padding: 14px;
            font-size: 1.15rem;
            margin-top: 5px;
        }

        #result-box {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }
        #result-box.show {
            display: flex;
        }

        /* 怪獸卡片本體 */
        .monster-card {
            width: 100%;
            background: var(--card-bg);
            border: 3px solid var(--primary-color);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            box-shadow: 0 0 35px rgba(255, 115, 0, 0.4);
            transform-style: preserve-3d;
            backface-visibility: hidden;
            opacity: 0;
            overflow: hidden;
            position: relative;
        }

        .monster-card.animate-pop-flip {
            animation: cardPopFlip 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes cardPopFlip {
            0% { transform: scale(0.1) rotateY(0deg) rotateX(20deg); opacity: 0; }
            60% { transform: scale(1.08) rotateY(540deg) rotateX(0deg); opacity: 1; }
            85% { transform: scale(0.96) rotateY(720deg); }
            100% { transform: scale(1) rotateY(720deg); opacity: 1; }
        }

        .monster-image-container {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            border: 2px solid var(--secondary-color);
            overflow: hidden;
            background: #000;
        }
        .monster-large-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .monster-large-emoji {
            font-size: 100px;
            line-height: 1;
        }

        .card-info-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }
        .card-info-row {
            font-size: 1.1rem;
            color: #ddd;
            line-height: 1.4;
            word-break: break-word;
        }
        .card-info-row strong {
            color: var(--primary-color);
        }
        .highlight-name {
            color: #fff;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .highlight-monster {
            color: #ff9d00;
            font-weight: bold;
            font-size: 1.25rem;
        }
        .highlight-scare {
            color: #ffff00;
            font-weight: bold;
            font-size: 1.4rem;
            text-shadow: 0 0 10px rgba(255, 255, 0, 0.6);
            font-family: monospace;
        }
        .desc-text {
            font-style: italic;
            color: #f0e6d2;
            margin-top: 4px;
            padding-left: 10px;
            border-left: 3px solid var(--secondary-color);
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            align-items: center;
            margin-top: 18px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }
        .button-group.show {
            opacity: 1;
            pointer-events: auto;
        }

        #message-box {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 51, 51, 0.9);
            padding: 12px 24px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            z-index: 100;
            display: none;
            text-align: center;
        }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 9999;
            display: none;
        }
    </style>
</head>
<body>

    <h1 id="main-title">你的內心怪獸 🎃</h1>
    <div id="message-box"></div>
    
    <div id="stage-container">
        <!-- 相機畫面區 -->
        <div id="cam-box">
            <video id="webcam" autoplay playsinline muted></video>
            
            <!-- 5秒連點集氣互動層 -->
            <div id="scan-overlay">
                <div class="scan-line"></div>
                <div id="energy-panel">
                    <div class="timer-display" id="timer-display">5.0s</div>
                    <div class="tap-counter-box">
                        <div class="tap-counter-title">⚡ 鏡頭內瘋狂連點！</div>
                        <div class="tap-count-text" id="tap-count-text">0</div>
                    </div>
                    <div class="tap-subhint">手指點越快，怪獸嚇人指數越高！🔥</div>
                </div>
            </div>
            
            <div id="status-text">相機初始化中...</div>
        </div>

        <!-- 下方控制列 -->
        <div class="controls-row" id="controls-row">
            <input type="text" id="user-name-input" placeholder="✍️ 輸入怪獸宿主名字" maxlength="15" autocomplete="off">
            <button id="scan-btn" class="btn" disabled>🔮 開始注入能量</button>
        </div>

        <!-- 結果頁面 -->
        <div id="result-box">
            <div class="monster-card" id="monster-card">
                <div class="monster-image-container" id="monster-image-box"></div>
                
                <div class="card-info-list">
                    <div class="card-info-row">
                        <strong>怪獸宿主：</strong><span id="res-user-name" class="highlight-name"></span>
                    </div>
                    <div class="card-info-row">
                        <strong>內心怪獸：</strong><span id="res-monster-name" class="highlight-monster"></span>
                    </div>
                    <div class="card-info-row">
                        <strong>嚇人指數：</strong><span id="res-scare-index" class="highlight-scare"></span>
                    </div>
                    <div class="card-info-row">
                        <strong>怪獸簡介：</strong>
                        <div id="res-monster-desc" class="desc-text"></div>
                    </div>
                </div>
            </div>

            <div class="button-group" id="button-group">
                <button id="download-btn" class="btn" style="width: 100%; max-width: 320px;">📸 下載怪獸結果卡片</button>
                <button id="reset-btn" class="btn btn-secondary" style="width: 100%; max-width: 320px;">🔄 不存檔 / 下一位挑戰</button>
            </div>
        </div>
    </div>

    <!-- 規則說明彈跳視窗 -->
    <div id="rules-modal">
        <div class="modal-content">
            <h3 class="modal-title">⚡ 怪獸能量挑戰說明 ⚡</h3>
            <ul class="modal-list">
                <li>你將有 <strong>5 秒</strong> 可以狂點注入怪獸能量，點擊越多次，這隻怪獸的嚇人指數就越高！</li>
                <li>滑鼠或手指必須放在<strong>攝影機鏡頭畫面區域內</strong>連點，才能成功累積次數。</li>
                <li>測驗結束後可自由選擇是否下載卡片；若點擊「不存檔」，系統<strong>不會進行任何儲存</strong>。</li>
            </ul>
            <button id="modal-start-btn" class="btn modal-btn-start">😈 我準備好了，開始 5 秒挑戰！</button>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>
    <canvas id="export-canvas" style="display:none;"></canvas>

    <script>
        const MONSTERS = [
            { 
                id: 'werewolf', 
                name: '綠毛狼人', 
                bgColor: '#4b3621', 
                imageUrl: './wolf.jpg', 
                soundUrl: './sounds/wolf.mp3',
                phrase: '「嗷嗚～今晚是滿月嗎？小心別惹我！」' 
            },
            { 
                id: 'frank', 
                name: '科學綠人', 
                bgColor: '#3a3b2a', 
                imageUrl: './frank.jpg', 
                soundUrl: './sounds/zombie.mp3',
                phrase: '「腦袋...我要吃腦袋...或是珍珠奶茶...」' 
            },
            { 
                id: 'vampire', 
                name: '吸血綠人', 
                bgColor: '#4a0e17', 
                imageUrl: './vampire.jpg', 
                soundUrl: './sounds/vampire.mp3',
                phrase: '「不吸血，只靠冰美式或拿鐵續命。」' 
            },
            { 
                id: 'ghost', 
                name: '驚嚇綠人', 
                bgColor: '#1a3320', 
                imageUrl: './ghost.jpg', 
                soundUrl: './sounds/ghost.mp3',
                phrase: '「你看不到我...你看不到我...」' 
            },
            { 
                id: 'pumpkin', 
                name: '萬聖南瓜王', 
                bgColor: '#1a3320', 
                imageUrl: './pumpkin.jpg', 
                soundUrl: './sounds/pumpkin.mp3',
                phrase: '「南瓜對身體很好，恭喜抽中全場大獎！」' 
            },
            { 
                id: 'wizard', 
                name: '魔法綠人', 
                bgColor: '#1a3320', 
                imageUrl: './wizard.jpg', 
                soundUrl: './sounds/wizard.mp3',
                phrase: '「登愣，我要把星期一變不見。」' 
            },
            { 
                id: 'mummy', 
                name: '繃帶綠人', 
                bgColor: '#1a3320', 
                imageUrl: './mummy.jpg', 
                soundUrl: './sounds/mummy.mp3',
                phrase: '「不要蓋住鼻子，我有過敏。」' 
            }
        ];

        let isCameraReady = false;
        let isChallenging = false;
        let tapCount = 0;
        let countdownTimer = null;
        let challengeEndTime = 0;
        let finalScareScore = 0;
        let finalMonsterResult = null;
        let currentUserName = '';

        let currentAudio = null;

        const video = document.getElementById("webcam");
        const camBox = document.getElementById("cam-box");
        const userNameInput = document.getElementById("user-name-input");
        const controlsRow = document.getElementById("controls-row");
        const scanBtn = document.getElementById("scan-btn");
        const scanOverlay = document.getElementById("scan-overlay");
        const timerDisplay = document.getElementById("timer-display");
        const tapCountText = document.getElementById("tap-count-text");
        const statusText = document.getElementById("status-text");
        const rulesModal = document.getElementById("rules-modal");
        const modalStartBtn = document.getElementById("modal-start-btn");
        const resultBox = document.getElementById("result-box");
        const monsterCard = document.getElementById("monster-card");
        const buttonGroup = document.getElementById("button-group");
        const resetBtn = document.getElementById("reset-btn");
        const downloadBtn = document.getElementById("download-btn");
        const messageBox = document.getElementById("message-box");
        const confettiCanvas = document.getElementById("confetti-canvas");

        function playMonsterMp3(monster) {
            if (!monster || !monster.soundUrl) return;
            try {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                }
                currentAudio = new Audio(monster.soundUrl);
                currentAudio.volume = 0.9;
                currentAudio.play().catch(err => {
                    console.log("音訊播放受限或找不到檔案:", err);
                });
            } catch (e) {
                console.error("播放音效失敗:", e);
            }
        }

        let confettiAnimationId = null;
        function triggerConfetti() {
            confettiCanvas.style.display = 'block';
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
            const ctx = confettiCanvas.getContext('2d');
            
            const particles = [];
            const colors = ['#ff7300', '#ffd700', '#8a2be2', '#00ff88', '#ff0055', '#00d0ff'];

            for (let i = 0; i < 120; i++) {
                particles.push({
                    x: confettiCanvas.width / 2 + (Math.random() - 0.5) * 80,
                    y: confettiCanvas.height / 2 + (Math.random() - 0.5) * 80,
                    w: Math.random() * 12 + 6,
                    h: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: (Math.random() - 0.5) * 22,
                    vy: (Math.random() - 0.7) * 20 - 4,
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 10,
                    gravity: 0.38,
                    drag: 0.96,
                    opacity: 1
                });
            }

            let startTimestamp = Date.now();

            function render() {
                ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
                let alive = false;

                particles.forEach(p => {
                    p.vx *= p.drag;
                    p.vy = p.vy * p.drag + p.gravity;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.rotation += p.vRot;

                    if (Date.now() - startTimestamp > 2500) {
                        p.opacity -= 0.015;
                    }

                    if (p.opacity > 0 && p.y < confettiCanvas.height + 50) {
                        alive = true;
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate((p.rotation * Math.PI) / 180);
                        ctx.globalAlpha = Math.max(0, p.opacity);
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                        ctx.restore();
                    }
                });

                if (alive) {
                    confettiAnimationId = requestAnimationFrame(render);
                } else {
                    confettiCanvas.style.display = 'none';
                    cancelAnimationFrame(confettiAnimationId);
                }
            }

            cancelAnimationFrame(confettiAnimationId);
            render();
        }

        function updateScanBtnState() {
            const hasName = userNameInput.value.trim().length > 0;
            if (isCameraReady && hasName && !isChallenging) {
                scanBtn.disabled = false;
                statusText.innerText = "準備就緒，點擊右方按鈕！";
            } else if (isCameraReady && !hasName) {
                scanBtn.disabled = true;
                statusText.innerText = "請輸入名字後開始挑戰 ✍️";
            }
        }

        userNameInput.addEventListener("input", updateScanBtnState);

        async function initCamera() {
            try {
                statusText.innerText = "請求相機權限中... 📷";
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                } catch (err) {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                }
                
                video.srcObject = stream;
                await video.play();

                isCameraReady = true;
                updateScanBtnState();
            } catch (error) {
                console.error("相機開啟失敗:", error);
                messageBox.innerHTML = "無法開啟相機。<br>請確認瀏覽器支援相機並已允許授權。";
                messageBox.style.display = "block";
                statusText.innerText = "相機開啟失敗";
            }
        }

        scanBtn.addEventListener("click", () => {
            currentUserName = userNameInput.value.trim();
            if (!currentUserName || isChallenging || !isCameraReady) return;
            rulesModal.classList.add("show");
        });

        modalStartBtn.addEventListener("click", () => {
            rulesModal.classList.remove("show");
            startEnergyChallenge();
        });

        function startEnergyChallenge() {
            isChallenging = true;
            tapCount = 0;
            tapCountText.innerText = '0';
            timerDisplay.innerText = '5.0s';
            
            controlsRow.style.display = 'none';
            statusText.innerText = "⚡ 請在鏡頭畫面內瘋狂連點！";
            scanOverlay.classList.add('active');

            const totalDuration = 5000;
            challengeEndTime = Date.now() + totalDuration;

            countdownTimer = setInterval(() => {
                const remaining = Math.max(0, challengeEndTime - Date.now());
                timerDisplay.innerText = (remaining / 1000).toFixed(1) + 's';

                if (remaining <= 0) {
                    clearInterval(countdownTimer);
                    isChallenging = false;
                    finishChallenge();
                }
            }, 60);
        }

        scanOverlay.addEventListener("pointerdown", (e) => {
            if (!isChallenging) return;
            e.preventDefault();

            tapCount++;
            tapCountText.innerText = tapCount;

            tapCountText.style.transform = 'scale(1.2)';
            setTimeout(() => { tapCountText.style.transform = 'scale(1)'; }, 60);
        });

        function finishChallenge() {
            scanOverlay.classList.remove('active');

            finalScareScore = tapCount;

            const randomIndex = Math.floor(Math.random() * MONSTERS.length);
            finalMonsterResult = MONSTERS[randomIndex];

            camBox.style.display = 'none';

            showResultCard(finalMonsterResult, currentUserName, finalScareScore);

            resultBox.classList.add('show');
            monsterCard.classList.add('animate-pop-flip');

            playMonsterMp3(finalMonsterResult);

            if (finalMonsterResult.id === 'pumpkin') {
                setTimeout(triggerConfetti, 300);
            }

            setTimeout(() => {
                buttonGroup.classList.add('show');
            }, 1200);
        }

        function showResultCard(monster, userName, scareScore) {
            const imageBox = document.getElementById('monster-image-box');
            imageBox.style.borderColor = monster.bgColor || 'var(--primary-color)';

            if (monster.imageUrl && monster.imageUrl.trim() !== '') {
                imageBox.innerHTML = `
                    <img src="${monster.imageUrl}" 
                         class="monster-large-img" 
                         alt="${monster.name}" 
                         onerror="this.onerror=null; this.outerHTML='<div class=\\'monster-large-emoji\\'>🎃</div>';">
                `;
            } else {
                imageBox.innerHTML = `<div class="monster-large-emoji">🎃</div>`;
            }

            document.getElementById('res-user-name').innerText = userName;
            document.getElementById('res-monster-name').innerText = monster.name;
            document.getElementById('res-scare-index').innerText = scareScore;
            document.getElementById('res-monster-desc').innerText = monster.phrase;
        }

        resetBtn.addEventListener("click", () => {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }

            monsterCard.classList.remove('animate-pop-flip');
            buttonGroup.classList.remove('show');
            resultBox.classList.remove('show');

            userNameInput.value = '';
            controlsRow.style.display = 'flex';
            camBox.style.display = 'block';
            
            updateScanBtnState();
        });

        // 圓角矩形繪製輔助工具
        function drawRoundedRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        // Canvas 專用 object-fit: cover 裁切繪圖工具（避免照片變形）
        function drawImageProp(ctx, img, x, y, w, h) {
            const nw = img.naturalWidth || img.width;
            const nh = img.naturalHeight || img.height;
            const imgRatio = nw / nh;
            const boxRatio = w / h;
            let sx = 0, sy = 0, sw = nw, sh = nh;
            if (imgRatio > boxRatio) {
                sw = nh * boxRatio;
                sx = (nw - sw) / 2;
            } else {
                sh = nw / boxRatio;
                sy = (nh - sh) / 2;
            }
            ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
        }

        // 📸 核心下載：等比例抓取網頁卡片尺寸，電腦直接靜默儲存、手機存相簿
        downloadBtn.addEventListener("click", () => {
            if (!finalMonsterResult) return;

            const cardEl = document.getElementById('monster-card');
            const cardW = cardEl.offsetWidth;
            const cardH = cardEl.offsetHeight;

            const exportCanvas = document.getElementById('export-canvas');
            const ctx = exportCanvas.getContext('2d');
            
            // 🎯 等比例放大 2 倍繪製，解析度更高且長寬比 100% 吻合網頁呈現
            const scale = 2;
            const exportWidth = Math.round(cardW * scale);
            const exportHeight = Math.round(cardH * scale);

            exportCanvas.width = exportWidth;
            exportCanvas.height = exportHeight;

            // 1. 卡片底色
            ctx.fillStyle = "#190f26";
            ctx.fillRect(0, 0, exportWidth, exportHeight);

            // 2. 外框（等比例圓角）
            const borderWidth = 3 * scale;
            const borderRadius = 20 * scale;
            ctx.strokeStyle = "#ff7300";
            ctx.lineWidth = borderWidth;
            drawRoundedRect(ctx, borderWidth / 2, borderWidth / 2, exportWidth - borderWidth, exportHeight - borderWidth, borderRadius);
            ctx.stroke();

            // 3. 繪製正方形照片區域
            const pad = 20 * scale;
            const imgBoxSize = exportWidth - (pad * 2);
            const imgX = pad;
            const imgY = pad;
            const imgRadius = 12 * scale;
            const borderColor = finalMonsterResult.bgColor || "#8a2be2";

            // 底色與圓角裁切（實現 object-fit: cover）
            ctx.save();
            drawRoundedRect(ctx, imgX, imgY, imgBoxSize, imgBoxSize, imgRadius);
            ctx.fillStyle = "#000000";
            ctx.fill();
            ctx.clip();

            const imgEl = document.querySelector('#monster-image-box img');
            if (imgEl && imgEl.complete && imgEl.naturalWidth > 0) {
                drawImageProp(ctx, imgEl, imgX, imgY, imgBoxSize, imgBoxSize);
            } else {
                ctx.fillStyle = "#ffffff";
                ctx.font = `${80 * scale}px sans-serif`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("🎃", imgX + imgBoxSize / 2, imgY + imgBoxSize / 2);
            }
            ctx.restore();

            // 照片邊框
            ctx.save();
            ctx.strokeStyle = borderColor;
            ctx.lineWidth = 2 * scale;
            drawRoundedRect(ctx, imgX, imgY, imgBoxSize, imgBoxSize, imgRadius);
            ctx.stroke();
            ctx.restore();

            // 4. 文字資訊排版（精確對齊網頁樣式）
            let currentY = imgY + imgBoxSize + (16 * scale);
            const rowGap = 10 * scale;
            const fontLabelSize = Math.round(17.5 * scale);

            ctx.textAlign = "left";
            ctx.textBaseline = "top";

            // 怪獸宿主
            ctx.font = `bold ${fontLabelSize}px 'Helvetica Neue', Arial, sans-serif`;
            ctx.fillStyle = "#ff7300";
            ctx.fillText("怪獸宿主：", imgX, currentY);
            let labelWidth = ctx.measureText("怪獸宿主：").width;
            ctx.font = `bold ${Math.round(19 * scale)}px 'Helvetica Neue', Arial, sans-serif`;
            ctx.fillStyle = "#ffffff";
            ctx.fillText(currentUserName, imgX + labelWidth, currentY - (1 * scale));

            currentY += Math.round(19 * scale) + rowGap;

            // 內心怪獸
            ctx.font = `bold ${fontLabelSize}px 'Helvetica Neue', Arial, sans-serif`;
            ctx.fillStyle = "#ff7300";
            ctx.fillText("內心怪獸：", imgX, currentY);
            labelWidth = ctx.measureText("內心怪獸：").width;
            ctx.font = `bold ${Math.round(20 * scale)}px 'Helvetica Neue', Arial, sans-serif`;
            ctx.fillStyle = "#ff9d00";
            ctx.fillText(finalMonsterResult.name, imgX + labelWidth, currentY - (1 * scale));

            currentY += Math.round(20 * scale) + rowGap;

            // 嚇人指數
            ctx.font = `bold ${fontLabelSize}px 'Helvetica Neue', Arial, sans-serif`;
            ctx.fillStyle = "#ff7300";
            ctx.fillText("嚇人指數：", imgX, currentY);
            labelWidth = ctx.measureText("嚇人指數：").width;
            ctx.font = `bold ${Math.round(22 * scale)}px monospace`;
            ctx.fillStyle = "#ffff00";
            ctx.fillText(`${finalScareScore}`, imgX + labelWidth, currentY - (2 * scale));

            currentY += Math.round(22 * scale) + rowGap;

            // 怪獸簡介標題
            ctx.font = `bold ${fontLabelSize}px 'Helvetica Neue', Arial, sans-serif`;
            ctx.fillStyle = "#ff7300";
            ctx.fillText("怪獸簡介：", imgX, currentY);
            currentY += fontLabelSize + (6 * scale);

            // 怪獸簡介內容（左側紫線條與斜體）
            const phrase = finalMonsterResult.phrase;
            const phraseFontSize = Math.round(16 * scale);
            ctx.font = `italic ${phraseFontSize}px 'Helvetica Neue', Arial, sans-serif`;
            ctx.fillStyle = "#f0e6d2";

            const maxTextW = imgBoxSize - (16 * scale);
            const chars = phrase.split('');
            let line = '';
            const lines = [];
            for (let n = 0; n < chars.length; n++) {
                const testLine = line + chars[n];
                if (ctx.measureText(testLine).width > maxTextW && n > 0) {
                    lines.push(line);
                    line = chars[n];
                } else {
                    line = testLine;
                }
            }
            lines.push(line);

            const lineHeight = phraseFontSize * 1.45;
            const blockHeight = lines.length * lineHeight;

            // 左側紫條
            ctx.strokeStyle = "#8a2be2";
            ctx.lineWidth = 3 * scale;
            ctx.beginPath();
            ctx.moveTo(imgX + (2 * scale), currentY);
            ctx.lineTo(imgX + (2 * scale), currentY + blockHeight);
            ctx.stroke();

            // 繪製文字
            lines.forEach((l, idx) => {
                ctx.fillText(l, imgX + (12 * scale), currentY + (idx * lineHeight));
            });

            // 5. 輸出邏輯判定
            const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
            const fileName = `${currentUserName}-內心怪獸-${finalMonsterResult.name}-嚇人指數${finalScareScore}.png`;

            // 🖥️ 電腦端：使用 Blob 搭配虛擬連結直接靜默下載，絕不喚醒任何系統分享對話框
            if (!isMobile) {
                exportCanvas.toBlob((blob) => {
                    if (!blob) return;
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => {
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }, 200);
                }, 'image/png');
                return;
            }

            // 📱 手機端：喚起原生儲存影像面板以存入相簿
            exportCanvas.toBlob(async (blob) => {
                if (!blob) return;
                const file = new File([blob], fileName, { type: "image/png" });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: '你的內心怪獸卡',
                            text: '快來看看我的萬聖節內心怪獸！'
                        });
                        return;
                    } catch (err) {
                        if (err.name === 'AbortError') return;
                    }
                }

                // 手機備援
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 200);
            }, 'image/png');
        });

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initCamera);
        } else {
            initCamera();
        }
    </script>
</body>
