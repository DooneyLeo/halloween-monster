<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你的內心怪獸 🎃</title>
    <style>
        :root {
            --bg-color: #12001a;
            --text-color: #f0e6d2;
            --primary-color: #ff7300;
            --secondary-color: #8a2be2;
            --error-color: #ff3333;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            color: var(--primary-color);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }
        #app-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 4/3;
            background: #000;
            border: 3px solid var(--secondary-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.4);
        }
        /* 相機畫面需鏡像顯示 */
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        #status-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 1.2rem;
            color: var(--primary-color);
            font-weight: bold;
            z-index: 10;
        }
        #message-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--primary-color);
            z-index: 20;
            display: none;
        }
        #message-box.error {
            border-color: var(--error-color);
            color: var(--error-color);
        }
        
        /* 除錯面板樣式 */
        #debug-panel {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 250px;
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            font-family: monospace;
            font-size: 10px;
            padding: 10px;
            overflow-y: auto;
            z-index: 30;
            display: none;
        }
    </style>
</head>
<body>

    <h1>你的內心怪獸</h1>
    
    <div id="app-container">
        <video id="webcam" autoplay playsinline></video>
        <div id="status-overlay">系統載入中... 🦇</div>
        <div id="message-box"></div>
        <div id="debug-panel"></div>
    </div>

    <!-- 匯入 MediaPipe 的 ES Module -->
    <script type="module">
        import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/vision_bundle.mjs";

        // ==========================================
        // 【設定區】方便之後調整的 CONFIG 物件
        // ==========================================
        const CONFIG = {
            monsters: {
                werewolf: {
                    id: 'werewolf',
                    name: '狼人',
                    emoji: '🐺',
                    color: '#8B4513',
                    imageUrl: './frank.jpg', // 預留圖片網址
                    weights: { browDownLeft: 1.0, browDownRight: 1.0, jawOpen: 1.5 }
                },
                vampire: {
                    id: 'vampire',
                    name: '吸血鬼',
                    emoji: '🧛',
                    color: '#800000',
                    imageUrl: './frank.jpg',
                    weights: { mouthSmileLeft: 0.5, mouthSmileRight: 0.5, eyeSquintLeft: 1.2, eyeSquintRight: 1.2 }
                },
                frankenstein: {
                    id: 'frankenstein',
                    name: '科學怪人',
                    emoji: '🧟‍♂️',
                    color: '#2E8B57',
                    imageUrl: './frank.jpg',
                    weights: { headTilt: 2.0 } // 特別為科學怪人預留的頭部傾斜權重
                },
                zombie: {
                    id: 'zombie',
                    name: '殭屍',
                    emoji: '🧟',
                    color: '#556B2F',
                    imageUrl: './frank.jpg',
                    weights: { eyeBlinkLeft: 0.8, eyeBlinkRight: 0.8, jawOpen: 0.5 }
                }
            }
        };

        // ==========================================
        // 【全域變數】
        // ==========================================
        let faceLandmarker;
        let lastVideoTime = -1;
        const video = document.getElementById("webcam");
        const statusOverlay = document.getElementById("status-overlay");
        const messageBox = document.getElementById("message-box");
        const debugPanel = document.getElementById("debug-panel");

        // 檢查是否開啟除錯模式 (?debug=1)
        const urlParams = new URLSearchParams(window.location.search);
        const isDebugMode = urlParams.get('debug') === '1';
        if (isDebugMode) {
            debugPanel.style.display = 'block';
        }

        // ==========================================
        // 【初始化與載入】
        // ==========================================
        async function init() {
            try {
                // 1. 載入 MediaPipe Face Landmarker 模型 (固定版本號 0.10.12)
                const filesetResolver = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/wasm"
                );
                
                faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
                    baseOptions: {
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
                        delegate: "GPU"
                    },
                    outputFaceBlendshapes: true,         // 開啟表情特徵值輸出
                    outputFacialTransformationMatrixes: true, // 開啟頭部姿態矩陣
                    runningMode: "VIDEO",
                    numFaces: 1
                });

                statusOverlay.innerText = "請求相機權限中... 📷";

                // 2. 開啟攝影機
                const constraints = { video: { facingMode: "user" } };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                video.addEventListener("loadeddata", predictWebcam);
            } catch (error) {
                console.error(error);
                showError("無法存取相機。<br>請確認您的裝置擁有相機，並已允許網頁存取相機權限。");
                statusOverlay.style.display = 'none';
            }
        }

        // ==========================================
        // 【主循環：偵測與更新】
        // ==========================================
        async function predictWebcam() {
            let startTimeMs = performance.now();
            
            // 確保影片有在播放且時間有前進才進行推論
            if (lastVideoTime !== video.currentTime) {
                lastVideoTime = video.currentTime;
                
                // 進行人臉偵測
                const results = faceLandmarker.detectForVideo(video, startTimeMs);
                
                if (results.faceBlendshapes && results.faceBlendshapes.length > 0) {
                    statusOverlay.innerText = "已偵測到人臉 👻";
                    
                    if (isDebugMode) {
                        updateDebugInfo(results);
                    }
                } else {
                    statusOverlay.innerText = "未偵測到人臉...";
                    if (isDebugMode) {
                        debugPanel.innerHTML = "等待人臉中...";
                    }
                }
            }
            
            // 透過 requestAnimationFrame 不斷循環
            window.requestAnimationFrame(predictWebcam);
        }

        // ==========================================
        // 【輔助函式】
        // ==========================================
        function showError(msg) {
            messageBox.innerHTML = msg;
            messageBox.className = "error";
            messageBox.style.display = "block";
        }

        // 除錯模式：顯示即時數據
        function updateDebugInfo(results) {
            let html = "<h3>Debug Mode</h3>";
            
            // 取得第一張臉的 Blendshapes
            const blendshapes = results.faceBlendshapes[0].categories;
            
            // 挑選我們在 CONFIG 裡會用到的特定表情來監控
            const trackedShapes = [
                'browDownLeft', 'browDownRight', 
                'jawOpen', 
                'mouthSmileLeft', 'mouthSmileRight', 
                'eyeSquintLeft', 'eyeSquintRight',
                'eyeBlinkLeft', 'eyeBlinkRight'
            ];

            html += "<h4>Blendshapes:</h4>";
            blendshapes.forEach(shape => {
                if (trackedShapes.includes(shape.categoryName) || shape.score > 0.5) {
                    // 若數值大於 0.5 或屬於我們關注的類別，則顯示出來
                    const color = trackedShapes.includes(shape.categoryName) ? '#ff0' : '#0f0';
                    html += `<div style="color:${color}">${shape.categoryName}: ${shape.score.toFixed(3)}</div>`;
                }
            });

            // 簡單計算一下頭部傾斜 (利用變換矩陣)
            if (results.facialTransformationMatrixes && results.facialTransformationMatrixes.length > 0) {
                const matrix = results.facialTransformationMatrixes[0].data;
                // 從 4x4 矩陣中提取簡單的傾斜指標 (這裡只是粗略的旋轉分量作為預覽)
                const pitch = Math.asin(-matrix[6]) * (180 / Math.PI);
                const yaw = Math.atan2(matrix[2], matrix[10]) * (180 / Math.PI);
                const roll = Math.atan2(matrix[4], matrix[5]) * (180 / Math.PI);
                
                html += "<h4>Head Pose:</h4>";
                html += `<div>Pitch (上下): ${pitch.toFixed(1)}°</div>`;
                html += `<div>Yaw (左右): ${yaw.toFixed(1)}°</div>`;
                html += `<div>Roll (歪頭): ${roll.toFixed(1)}°</div>`;
            }

            debugPanel.innerHTML = html;
        }

        // 啟動程式
        init();
    </script>
</body>
</html>
