<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你的內心怪獸 🎃</title>
    <style>
        :root {
            --bg-color: #0d0014;
            --text-color: #f0e6d2;
            --primary-color: #ff7300;
            --secondary-color: #8a2be2;
            --card-bg: #190f26;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            color: var(--primary-color);
            text-shadow: 0 0 12px rgba(255, 115, 0, 0.6);
            margin: 0 0 15px 0;
            text-align: center;
            font-size: 2.2rem;
        }
        
        /* 舞台區開啟 3D 視角 */
        #stage-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            perspective: 1000px;
        }
        
        /* 相機畫面區 */
        #cam-box {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #000;
            border: 3px solid var(--secondary-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.4);
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* 鏡像 */
        }

        /* 掃描動畫覆蓋層 */
        #scan-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
        }
        #scan-overlay.active {
            display: flex;
        }
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--primary-color), #fff, var(--primary-color), transparent);
            box-shadow: 0 0 15px var(--primary-color);
            animation: scanMove 1.5s ease-in-out infinite alternate;
        }
        @keyframes scanMove {
            0% { top: 5%; }
            100% { top: 95%; }
        }
        .scan-countdown {
            font-size: 4rem;
            font-weight: bold;
            color: var(--primary-color);
            text-shadow: 0 0 20px #000;
            animation: pulse 0.5s infinite alternate;
        }

        #status-text {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--primary-color);
            white-space: nowrap;
        }

        /* 名字輸入欄位樣式 */
        .input-group {
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .input-group label {
            font-size: 1rem;
            color: var(--primary-color);
            font-weight: bold;
        }
        #user-name-input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: 2px solid var(--secondary-color);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }
        #user-name-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 12px rgba(255, 115, 0, 0.5);
            background: rgba(255, 255, 255, 0.15);
        }

        /* 結果容器 */
        #result-box {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }
        #result-box.show {
            display: flex;
        }

        /* 直式合成卡片主體 */
        .monster-card {
            width: 100%;
            background: var(--card-bg);
            border: 3px solid var(--primary-color);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            box-shadow: 0 0 35px rgba(255, 115, 0, 0.4);
            transform-style: preserve-3d;
            backface-visibility: hidden;
            opacity: 0;
            overflow: hidden;
        }

        /* 3D 彈跳翻牌動畫 */
        .monster-card.animate-pop-flip {
            animation: cardPopFlip 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes cardPopFlip {
            0% {
                transform: scale(0.1) rotateY(0deg) rotateX(20deg);
                opacity: 0;
            }
            60% {
                transform: scale(1.08) rotateY(540deg) rotateX(0deg);
                opacity: 1;
            }
            85% {
                transform: scale(0.96) rotateY(720deg);
            }
            100% {
                transform: scale(1) rotateY(720deg);
                opacity: 1;
            }
        }

        /* 1:1 正方形圖片區 */
        .monster-image-container {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
            border: 2px solid var(--secondary-color);
            overflow: hidden;
            background: #000;
        }
        .monster-large-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .monster-large-emoji {
            font-size: 110px;
            line-height: 1;
        }

        /* 卡片文字資訊排版 */
        .card-info-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }
        .card-info-row {
            font-size: 1.15rem;
            color: #ddd;
            line-height: 1.5;
            word-break: break-word;
        }
        .card-info-row strong {
            color: var(--primary-color);
        }
        .highlight-name {
            color: #fff;
            font-weight: bold;
            font-size: 1.25rem;
        }
        .highlight-monster {
            color: #ff9d00;
            font-weight: bold;
            font-size: 1.3rem;
        }
        .desc-text {
            font-style: italic;
            color: #f0e6d2;
            margin-top: 4px;
            padding-left: 10px;
            border-left: 3px solid var(--secondary-color);
        }

        /* 按鈕容器（延遲出現） */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            align-items: center;
            margin-top: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }
        .button-group.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* 按鈕樣式 */
        .btn {
            background: linear-gradient(135deg, var(--primary-color), #d05000);
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-size: 1.15rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 115, 0, 0.4);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            max-width: 320px;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 115, 0, 0.6);
        }
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.5;
            box-shadow: none;
        }
        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary-color), #5a189a);
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        #message-box {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 51, 51, 0.9);
            padding: 15px 30px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            z-index: 100;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1 id="main-title">你的內心怪獸 🎃</h1>
    <div id="message-box"></div>
    
    <div id="stage-container">
        <!-- 相機畫面置中區 -->
        <div id="cam-box">
            <video id="webcam" autoplay playsinline></video>
            
            <!-- 掃描特效與倒數 -->
            <div id="scan-overlay">
                <div class="scan-line"></div>
                <div class="scan-countdown" id="scan-countdown">3</div>
            </div>
            
            <div id="status-text">相機初始化中...</div>
        </div>

        <!-- 名字輸入欄位 -->
        <div class="input-group" id="input-group">
            <label for="user-name-input">✍️ 請先輸入你的名字：</label>
            <input type="text" id="user-name-input" placeholder="例如：小明" maxlength="15" autocomplete="off">
        </div>

        <!-- 掃描觸發按鈕（需輸入名字才可點擊） -->
        <button id="scan-btn" class="btn" disabled>🔮 開始掃描萬聖怪獸</button>

        <!-- 結果頁面：直式合成卡片與延遲浮現按鈕 -->
        <div id="result-box">
            <!-- 翻牌卡片主體 -->
            <div class="monster-card" id="monster-card">
                <!-- 1:1 正方形怪獸圖片 -->
                <div class="monster-image-container" id="monster-image-box"></div>
                
                <!-- 卡片文字資訊 -->
                <div class="card-info-list">
                    <div class="card-info-row">
                        <strong>名字：</strong><span id="res-user-name" class="highlight-name"></span>
                    </div>
                    <div class="card-info-row">
                        <strong>內心怪獸：</strong><span id="res-monster-name" class="highlight-monster"></span>
                    </div>
                    <div class="card-info-row">
                        <strong>怪獸簡介：</strong>
                        <div id="res-monster-desc" class="desc-text"></div>
                    </div>
                </div>
            </div>

            <!-- 動畫完結後顯示的控制按鈕 -->
            <div class="button-group" id="button-group">
                <button id="download-btn" class="btn">📸 下載怪獸結果卡片</button>
                <button id="reset-btn" class="btn btn-secondary">🔄 重置設施（下一位）</button>
            </div>
        </div>
    </div>

    <!-- 用於合成下載卡片的隱藏 Canvas -->
    <canvas id="export-canvas" style="display:none;"></canvas>

    <script>
        // 怪獸資料庫（讀取同目錄下的圖片檔）
        const MONSTERS = [
            { 
                id: 'werewolf', 
                name: '狂暴狼人', 
                bgColor: '#4b3621', 
                imageUrl: './frank.jpg', 
                phrase: '「嗷嗚～今晚是滿月嗎？小心別惹我！」' 
            },
            { 
                id: 'zombie', 
                name: '茫然殭屍', 
                bgColor: '#3a3b2a', 
                imageUrl: './frank.jpg', 
                phrase: '「腦袋...我要吃腦袋...或是珍珠奶茶...」' 
            },
            { 
                id: 'vampire', 
                name: '高雅吸血鬼', 
                bgColor: '#4a0e17', 
                imageUrl: './frank.jpg', 
                phrase: '「今夜的月色真美，要來一杯新鮮番茄汁嗎？」' 
            },
            { 
                id: 'frankenstein', 
                name: '科學怪人', 
                bgColor: '#1a3320', 
                imageUrl: './frank.jpg', 
                phrase: '「雷電...賜予我力量！我只是頭有點歪而已。」' 
            }
        ];

        let isCameraReady = false;
        let isScanning = false;
        let finalMonsterResult = null;
        let currentUserName = '';

        const video = document.getElementById("webcam");
        const camBox = document.getElementById("cam-box");
        const userNameInput = document.getElementById("user-name-input");
        const inputGroup = document.getElementById("input-group");
        const scanBtn = document.getElementById("scan-btn");
        const scanOverlay = document.getElementById("scan-overlay");
        const scanCountdownEl = document.getElementById("scan-countdown");
        const statusText = document.getElementById("status-text");
        const resultBox = document.getElementById("result-box");
        const monsterCard = document.getElementById("monster-card");
        const buttonGroup = document.getElementById("button-group");
        const resetBtn = document.getElementById("reset-btn");
        const downloadBtn = document.getElementById("download-btn");
        const messageBox = document.getElementById("message-box");

        // 檢查按鈕啟用條件（相機就緒 + 已輸入名字）
        function updateScanBtnState() {
            const hasName = userNameInput.value.trim().length > 0;
            if (isCameraReady && hasName && !isScanning) {
                scanBtn.disabled = false;
                statusText.innerText = "準備就緒，點擊下方按鈕開始！";
            } else if (isCameraReady && !hasName) {
                scanBtn.disabled = true;
                statusText.innerText = "請先輸入名字再開始掃描 ✍️";
            }
        }

        // 監聽名字輸入事件
        userNameInput.addEventListener("input", updateScanBtnState);

        // 啟動相機
        async function initCamera() {
            try {
                statusText.innerText = "請求相機權限中... 📷";
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;
                
                video.addEventListener("loadeddata", () => {
                    isCameraReady = true;
                    updateScanBtnState();
                });
            } catch (error) {
                console.error("相機開啟失敗:", error);
                messageBox.innerHTML = "無法開啟相機。<br>請確認裝置擁有相機並允許存取。";
                messageBox.style.display = "block";
                statusText.innerText = "相機開啟失敗";
            }
        }

        // 點擊掃描：開啟 3 秒雷射倒數
        scanBtn.addEventListener("click", () => {
            currentUserName = userNameInput.value.trim();
            if (!currentUserName || isScanning || !isCameraReady) return;
            
            isScanning = true;
            scanBtn.disabled = true;
            scanBtn.style.display = 'none';
            inputGroup.style.display = 'none';
            statusText.innerText = "正在分析你的內心怪獸...";
            scanOverlay.classList.add('active');

            let countdown = 3;
            scanCountdownEl.innerText = countdown;

            const timer = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    scanCountdownEl.innerText = countdown;
                } else {
                    clearInterval(timer);
                    finishScan();
                }
            }, 1000);
        });

        // 掃描完成：隱藏相機，卡片 3D 翻轉彈出
        function finishScan() {
            isScanning = false;
            scanOverlay.classList.remove('active');

            // 隨機抽選怪獸
            const randomIndex = Math.floor(Math.random() * MONSTERS.length);
            finalMonsterResult = MONSTERS[randomIndex];

            // 1. 隱藏相機框
            camBox.style.display = 'none';

            // 2. 載入卡片資訊
            showResultCard(finalMonsterResult, currentUserName);

            // 3. 顯示結果區並觸發 3D 彈跳翻轉動畫
            resultBox.classList.add('show');
            monsterCard.classList.add('animate-pop-flip');

            // 4. 動畫播放完畢後（1.2 秒），淡入顯示按鈕
            setTimeout(() => {
                buttonGroup.classList.add('show');
            }, 1200);
        }

        // 填入直式卡片資料（純文字名稱，不組合任何 Emoji）
        function showResultCard(monster, userName) {
            const imageBox = document.getElementById('monster-image-box');
            imageBox.style.borderColor = monster.bgColor || 'var(--primary-color)';

            if (monster.imageUrl && monster.imageUrl.trim() !== '') {
                imageBox.innerHTML = `
                    <img src="${monster.imageUrl}" 
                         class="monster-large-img" 
                         alt="${monster.name}" 
                         onerror="this.onerror=null; this.outerHTML='<div class=\\'monster-large-emoji\\'>🎃</div>';">
                `;
            } else {
                imageBox.innerHTML = `<div class="monster-large-emoji">🎃</div>`;
            }

            document.getElementById('res-user-name').innerText = userName;
            document.getElementById('res-monster-name').innerText = monster.name;
            document.getElementById('res-monster-desc').innerText = monster.phrase;
        }

        // 重置設施：清空輸入，叫回相機框，供下一位體驗
        resetBtn.addEventListener("click", () => {
            monsterCard.classList.remove('animate-pop-flip');
            buttonGroup.classList.remove('show');
            resultBox.classList.remove('show');

            userNameInput.value = '';
            inputGroup.style.display = 'flex';
            camBox.style.display = 'block';
            scanBtn.style.display = 'inline-flex';
            
            updateScanBtnState();
        });

        // 合成直式卡片並下載圖檔（純文字名稱，不組合任何 Emoji）
        downloadBtn.addEventListener("click", () => {
            if (!finalMonsterResult) return;

            const exportCanvas = document.getElementById('export-canvas');
            const ctx = exportCanvas.getContext('2d');
            
            exportCanvas.width = 600;
            exportCanvas.height = 900;

            // 背景底色
            ctx.fillStyle = "#190f26";
            ctx.fillRect(0, 0, 600, 900);

            // 卡片橘色邊框
            ctx.strokeStyle = "#ff7300";
            ctx.lineWidth = 10;
            ctx.strokeRect(15, 15, 570, 870);

            // 頂部標題
            ctx.fillStyle = "#ff7300";
            ctx.font = "bold 34px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("🎃 萬聖節內心怪獸卡 🎃", 300, 65);

            // 繪製正方形怪獸圖片區域
            const imgContainer = document.querySelector('#monster-image-box img');
            if (imgContainer && imgContainer.complete) {
                ctx.drawImage(imgContainer, 50, 90, 500, 500);
            } else {
                ctx.fillStyle = "#000000";
                ctx.fillRect(50, 90, 500, 500);
                ctx.fillStyle = "#ffffff";
                ctx.font = "100px sans-serif";
                ctx.fillText("🎃", 300, 370);
            }
            ctx.strokeStyle = "#8a2be2";
            ctx.lineWidth = 4;
            ctx.strokeRect(50, 90, 500, 500);

            // 繪製文字區域（左對齊）
            ctx.textAlign = "left";
            
            // 名字
            ctx.fillStyle = "#ff7300";
            ctx.font = "bold 26px sans-serif";
            ctx.fillText("名字：", 50, 630);
            ctx.fillStyle = "#ffffff";
            ctx.font = "26px sans-serif";
            ctx.fillText(currentUserName, 150, 630);

            // 內心怪獸（純名稱）
            ctx.fillStyle = "#ff7300";
            ctx.font = "bold 26px sans-serif";
            ctx.fillText("內心怪獸：", 50, 680);
            ctx.fillStyle = "#ff9d00";
            ctx.font = "bold 28px sans-serif";
            ctx.fillText(finalMonsterResult.name, 190, 680);

            // 簡介
            ctx.fillStyle = "#ff7300";
            ctx.font = "bold 26px sans-serif";
            ctx.fillText("怪獸簡介：", 50, 730);
            ctx.fillStyle = "#f0e6d2";
            ctx.font = "italic 22px sans-serif";
            
            // 簡介文字
            const phrase = finalMonsterResult.phrase;
            ctx.fillText(phrase, 50, 770);

            // 底部宣傳字
            ctx.fillStyle = "#8a2be2";
            ctx.font = "18px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("萬聖節特別企劃 — 內心怪獸測驗", 300, 850);

            // 下載 PNG 圖檔
            const link = document.createElement('a');
            link.download = `${currentUserName}-內心怪獸-${finalMonsterResult.name}.png`;
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
        });

        // 初始化相機
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initCamera);
        } else {
            initCamera();
        }
    </script>
</body>
</html>
