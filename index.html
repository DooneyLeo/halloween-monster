<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>你的內心怪獸 🎃</title>
    <style>
        :root {
            --bg-color: #0d0014;
            --text-color: #f0e6d2;
            --primary-color: #ff7300;
            --secondary-color: #8a2be2;
            --card-bg: #190f26;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 12px 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: manipulation; /* 防止手機連點時畫面意外縮放 */
        }
        h1 {
            color: var(--primary-color);
            text-shadow: 0 0 12px rgba(255, 115, 0, 0.6);
            margin: 0 0 10px 0;
            text-align: center;
            font-size: 1.6rem;
        }
        
        #stage-container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            perspective: 1000px;
        }
        
        /* 1. 相機畫面區：佔比約 76~80vh */
        #cam-box {
            position: relative;
            width: 100%;
            height: 76vh;
            background: #000;
            border: 3px solid var(--secondary-color);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.4);
            user-select: none;
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        /* 連點掃描能量覆蓋層 */
        #scan-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.55);
            cursor: pointer;
            z-index: 10;
        }
        #scan-overlay.active {
            display: flex;
        }
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--primary-color), #fff, var(--primary-color), transparent);
            box-shadow: 0 0 15px var(--primary-color);
            animation: scanMove 1.5s ease-in-out infinite alternate;
            pointer-events: none;
        }
        @keyframes scanMove {
            0% { top: 5%; }
            100% { top: 95%; }
        }

        /* 能量收集面板樣式 */
        #energy-panel {
            width: 85%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            pointer-events: none;
        }
        .energy-title {
            font-size: 1.4rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 15px var(--primary-color), 0 0 30px var(--secondary-color);
            animation: titlePulse 0.6s infinite alternate;
            text-align: center;
        }
        @keyframes titlePulse {
            from { transform: scale(0.96); }
            to { transform: scale(1.04); }
        }
        .energy-bar-wrap {
            width: 100%;
            height: 26px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--primary-color);
            border-radius: 20px;
            padding: 3px;
            box-shadow: 0 0 15px rgba(255, 115, 0, 0.4);
            overflow: hidden;
        }
        .energy-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #8a2be2, #ff7300, #ffff00);
            border-radius: 14px;
            box-shadow: 0 0 12px rgba(255, 255, 0, 0.8);
            transition: width 0.08s ease-out;
        }
        .energy-text {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffff00;
            text-shadow: 0 0 15px #ff7300, 0 0 5px #000;
            font-family: monospace;
        }
        .tap-subhint {
            font-size: 0.95rem;
            color: #ddd;
            background: rgba(0,0,0,0.6);
            padding: 4px 14px;
            border-radius: 12px;
        }

        #status-text {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--primary-color);
            white-space: nowrap;
            pointer-events: none;
        }

        /* 2. 下方控制區：輸入框與按鈕水平並列 */
        .controls-row {
            width: 100%;
            display: flex;
            flex-direction: row;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }
        #user-name-input {
            flex: 1;
            min-width: 0;
            padding: 12px 16px;
            border-radius: 25px;
            border: 2px solid var(--secondary-color);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }
        #user-name-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 12px rgba(255, 115, 0, 0.5);
            background: rgba(255, 255, 255, 0.15);
        }

        .btn {
            background: linear-gradient(135deg, var(--primary-color), #d05000);
            color: #fff;
            border: none;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 115, 0, 0.4);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 115, 0, 0.6);
        }
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.5;
            box-shadow: none;
        }
        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary-color), #5a189a);
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
        }

        #result-box {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }
        #result-box.show {
            display: flex;
        }

        .monster-card {
            width: 100%;
            background: var(--card-bg);
            border: 3px solid var(--primary-color);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            box-shadow: 0 0 35px rgba(255, 115, 0, 0.4);
            transform-style: preserve-3d;
            backface-visibility: hidden;
            opacity: 0;
            overflow: hidden;
            position: relative;
        }

        .monster-card.animate-pop-flip {
            animation: cardPopFlip 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes cardPopFlip {
            0% {
                transform: scale(0.1) rotateY(0deg) rotateX(20deg);
                opacity: 0;
            }
            60% {
                transform: scale(1.08) rotateY(540deg) rotateX(0deg);
                opacity: 1;
            }
            85% {
                transform: scale(0.96) rotateY(720deg);
            }
            100% {
                transform: scale(1) rotateY(720deg);
                opacity: 1;
            }
        }

        .monster-image-container {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            border: 2px solid var(--secondary-color);
            overflow: hidden;
            background: #000;
        }
        .monster-large-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .monster-large-emoji {
            font-size: 100px;
            line-height: 1;
        }

        .card-info-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }
        .card-info-row {
            font-size: 1.1rem;
            color: #ddd;
            line-height: 1.4;
            word-break: break-word;
        }
        .card-info-row strong {
            color: var(--primary-color);
        }
        .highlight-name {
            color: #fff;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .highlight-monster {
            color: #ff9d00;
            font-weight: bold;
            font-size: 1.25rem;
        }
        .highlight-time {
            color: #ffff00;
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 0 0 10px rgba(255, 255, 0, 0.6);
            font-family: monospace;
        }
        .desc-text {
            font-style: italic;
            color: #f0e6d2;
            margin-top: 4px;
            padding-left: 10px;
            border-left: 3px solid var(--secondary-color);
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            align-items: center;
            margin-top: 18px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }
        .button-group.show {
            opacity: 1;
            pointer-events: auto;
        }

        #message-box {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 51, 51, 0.9);
            padding: 12px 24px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            z-index: 100;
            display: none;
            text-align: center;
        }

        /* 彩色綵帶畫布 (固定覆蓋在畫面最頂層) */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            display: none;
        }
    </style>
</head>
<body>

    <h1 id="main-title">你的內心怪獸 🎃</h1>
    <div id="message-box"></div>
    
    <div id="stage-container">
        <!-- 相機畫面置中區 -->
        <div id="cam-box">
            <video id="webcam" autoplay playsinline muted></video>
            
            <!-- 連點集氣互動層 -->
            <div id="scan-overlay">
                <div class="scan-line"></div>
                <div id="energy-panel">
                    <div class="energy-title">⚡ 快速連點注入怪獸能量！ ⚡</div>
                    <div class="energy-bar-wrap">
                        <div class="energy-bar-fill" id="energy-bar-fill"></div>
                    </div>
                    <div class="energy-text" id="energy-text">0%</div>
                    <div class="tap-subhint">手指點太慢，能量會倒退流失喔！🔥</div>
                </div>
            </div>
            
            <div id="status-text">相機初始化中...</div>
        </div>

        <!-- 下方控制列：名字輸入與掃描按鈕水平並列 -->
        <div class="controls-row" id="controls-row">
            <input type="text" id="user-name-input" placeholder="✍️ 輸入怪獸宿主名字" maxlength="15" autocomplete="off">
            <button id="scan-btn" class="btn" disabled>🔮 開始注入能量</button>
        </div>

        <!-- 結果頁面：直式合成卡片與延遲浮現按鈕 -->
        <div id="result-box">
            <div class="monster-card" id="monster-card">
                <div class="monster-image-container" id="monster-image-box"></div>
                
                <div class="card-info-list">
                    <div class="card-info-row">
                        <strong>怪獸宿主：</strong><span id="res-user-name" class="highlight-name"></span>
                    </div>
                    <div class="card-info-row">
                        <strong>內心怪獸：</strong><span id="res-monster-name" class="highlight-monster"></span>
                    </div>
                    <div class="card-info-row">
                        <strong>變身耗時：</strong><span id="res-elapsed-time" class="highlight-time"></span>
                    </div>
                    <div class="card-info-row">
                        <strong>怪獸簡介：</strong>
                        <div id="res-monster-desc" class="desc-text"></div>
                    </div>
                </div>
            </div>

            <div class="button-group" id="button-group">
                <button id="download-btn" class="btn" style="width: 100%; max-width: 320px;">📸 下載怪獸結果卡片</button>
                <button id="reset-btn" class="btn btn-secondary" style="width: 100%; max-width: 320px;">🔄 重置設施（下一位）</button>
            </div>
        </div>
    </div>

    <!-- 綵帶 Canvas 與 卡片導出 Canvas -->
    <canvas id="confetti-canvas"></canvas>
    <canvas id="export-canvas" style="display:none;"></canvas>

    <script>
        // 🎵 在陣列中加入 soundUrl 欄位，指向自訂的 mp3 配音
        const MONSTERS = [
            { 
                id: 'werewolf', 
                name: '綠毛狼人', 
                bgColor: '#4b3621', 
                imageUrl: './wolf.jpg', 
                soundUrl: './sounds/wolf.mp3',
                phrase: '「嗷嗚～今晚是滿月嗎？小心別惹我！」' 
            },
            { 
                id: 'frank', 
                name: '科學綠人', 
                bgColor: '#3a3b2a', 
                imageUrl: './frank.jpg', 
                soundUrl: './sounds/zombie.mp3',
                phrase: '「腦袋...我要吃腦袋...或是珍珠奶茶...」' 
            },
            { 
                id: 'vampire', 
                name: '吸血綠人', 
                bgColor: '#4a0e17', 
                imageUrl: './vampire.jpg', 
                soundUrl: './sounds/vampire.mp3',
                phrase: '「不吸血，只靠冰美式或拿鐵續命。」' 
            },
            { 
                id: 'ghost', 
                name: '驚嚇綠人', 
                bgColor: '#1a3320', 
                imageUrl: './ghost.jpg', 
                soundUrl: './sounds/ghost.mp3',
                phrase: '「你看不到我...你看不到我...」' 
            },
            { 
                id: 'pumpkin', 
                name: '萬聖南瓜王', 
                bgColor: '#1a3320', 
                imageUrl: './pumpkin.jpg', 
                soundUrl: './sounds/pumpkin.mp3',
                phrase: '「南瓜對身體很好，恭喜抽中全場大獎！」' 
            },
            { 
                id: 'wizard', 
                name: '魔法綠人', 
                bgColor: '#1a3320', 
                imageUrl: './wizard.jpg', 
                soundUrl: './sounds/wizard.mp3',
                phrase: '「登愣，我要把星期一變不見。」' 
            },
            { 
                id: 'mummy', 
                name: '繃帶綠人', 
                bgColor: '#1a3320', 
                imageUrl: './mummy.jpg', 
                soundUrl: './sounds/mummy.mp3',
                phrase: '「不要蓋住鼻子，我有過敏。」' 
            }
        ];

        let isCameraReady = false;
        let isCharging = false;
        let energyValue = 0;
        let decayInterval = null;
        let finalMonsterResult = null;
        let currentUserName = '';

        // ⏱️ 計時器變數
        let chargeStartTime = 0;
        let currentElapsedSeconds = '0.00';

        // 🔊 目前播放中的音訊物件
        let currentAudio = null;

        const video = document.getElementById("webcam");
        const camBox = document.getElementById("cam-box");
        const userNameInput = document.getElementById("user-name-input");
        const controlsRow = document.getElementById("controls-row");
        const scanBtn = document.getElementById("scan-btn");
        const scanOverlay = document.getElementById("scan-overlay");
        const energyBarFill = document.getElementById("energy-bar-fill");
        const energyText = document.getElementById("energy-text");
        const statusText = document.getElementById("status-text");
        const resultBox = document.getElementById("result-box");
        const monsterCard = document.getElementById("monster-card");
        const buttonGroup = document.getElementById("button-group");
        const resetBtn = document.getElementById("reset-btn");
        const downloadBtn = document.getElementById("download-btn");
        const messageBox = document.getElementById("message-box");
        const confettiCanvas = document.getElementById("confetti-canvas");

        // --- 🎵 MP3 播放函式 ---
        function playMonsterMp3(monster) {
            if (!monster || !monster.soundUrl) return;
            try {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                }
                currentAudio = new Audio(monster.soundUrl);
                currentAudio.volume = 0.9;
                currentAudio.play().catch(err => {
                    console.log("音訊播放被瀏覽器阻擋或找不到檔案:", err);
                });
            } catch (e) {
                console.error("播放音效失敗:", e);
            }
        }

        // --- 🎊 南瓜王大獎彩色綵帶動畫 (Confetti) ---
        let confettiAnimationId = null;
        function triggerConfetti() {
            confettiCanvas.style.display = 'block';
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
            const ctx = confettiCanvas.getContext('2d');
            
            const particles = [];
            const colors = ['#ff7300', '#ffd700', '#8a2be2', '#00ff88', '#ff0055', '#00d0ff'];

            for (let i = 0; i < 120; i++) {
                particles.push({
                    x: confettiCanvas.width / 2 + (Math.random() - 0.5) * 80,
                    y: confettiCanvas.height / 2 + (Math.random() - 0.5) * 80,
                    w: Math.random() * 12 + 6,
                    h: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: (Math.random() - 0.5) * 22,
                    vy: (Math.random() - 0.7) * 20 - 4,
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 10,
                    gravity: 0.38,
                    drag: 0.96,
                    opacity: 1
                });
            }

            let startTimestamp = Date.now();

            function render() {
                ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
                let alive = false;

                particles.forEach(p => {
                    p.vx *= p.drag;
                    p.vy = p.vy * p.drag + p.gravity;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.rotation += p.vRot;

                    if (Date.now() - startTimestamp > 2500) {
                        p.opacity -= 0.015;
                    }

                    if (p.opacity > 0 && p.y < confettiCanvas.height + 50) {
                        alive = true;
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate((p.rotation * Math.PI) / 180);
                        ctx.globalAlpha = Math.max(0, p.opacity);
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                        ctx.restore();
                    }
                });

                if (alive) {
                    confettiAnimationId = requestAnimationFrame(render);
                } else {
                    confettiCanvas.style.display = 'none';
                    cancelAnimationFrame(confettiAnimationId);
                }
            }

            cancelAnimationFrame(confettiAnimationId);
            render();
        }

        // --- 核心邏輯 ---
        function updateScanBtnState() {
            const hasName = userNameInput.value.trim().length > 0;
            if (isCameraReady && hasName && !isCharging) {
                scanBtn.disabled = false;
                statusText.innerText = "準備就緒，點擊右方按鈕！";
            } else if (isCameraReady && !hasName) {
                scanBtn.disabled = true;
                statusText.innerText = "請輸入名字後開始掃描 ✍️";
            }
        }

        userNameInput.addEventListener("input", updateScanBtnState);

        async function initCamera() {
            try {
                statusText.innerText = "請求相機權限中... 📷";
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                } catch (err) {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                }
                
                video.srcObject = stream;
                await video.play();

                isCameraReady = true;
                updateScanBtnState();
            } catch (error) {
                console.error("相機開啟失敗:", error);
                messageBox.innerHTML = "無法開啟相機。<br>請確認瀏覽器支援相機並已允許授權。";
                messageBox.style.display = "block";
                statusText.innerText = "相機開啟失敗";
            }
        }

        // 點擊「開始掃描」：開始計時並進入連點集氣模式
        scanBtn.addEventListener("click", () => {
            currentUserName = userNameInput.value.trim();
            if (!currentUserName || isCharging || !isCameraReady) return;

            isCharging = true;
            energyValue = 0;
            energyBarFill.style.width = '0%';
            energyText.innerText = '0%';
            
            // ⏱️ 開始計時 (毫秒)
            chargeStartTime = Date.now();

            controlsRow.style.display = 'none';
            statusText.innerText = "⚡ 連續狂點畫面注入能量！";
            scanOverlay.classList.add('active');

            // 啟動能量緩慢流失機制 (每 50ms 扣減 0.75%)
            decayInterval = setInterval(() => {
                if (energyValue > 0) {
                    energyValue = Math.max(0, energyValue - 0.75);
                    energyBarFill.style.width = `${energyValue}%`;
                    energyText.innerText = `${Math.floor(energyValue)}%`;
                }
            }, 50);
        });

        // 點擊畫面任意區域進行能量累積
        function handleChargeTap(e) {
            if (!isCharging) return;
            e.preventDefault();

            // 每次點擊增加約 7.5% 能量
            energyValue = Math.min(100, energyValue + 7.5);
            energyBarFill.style.width = `${energyValue}%`;
            energyText.innerText = `${Math.floor(energyValue)}%`;

            // 充飽 100% 成功變身
            if (energyValue >= 100) {
                isCharging = false;
                clearInterval(decayInterval);

                // ⏱️ 計算從按下掃描到集滿 100% 的總耗時 (秒，保留兩位小數)
                const elapsedMs = Date.now() - chargeStartTime;
                currentElapsedSeconds = (elapsedMs / 1000).toFixed(2);

                finishTransformation();
            }
        }

        scanOverlay.addEventListener("pointerdown", handleChargeTap);

        function finishTransformation() {
            scanOverlay.classList.remove('active');

            const randomIndex = Math.floor(Math.random() * MONSTERS.length);
            finalMonsterResult = MONSTERS[randomIndex];

            camBox.style.display = 'none';

            // 顯示卡片結果（包含耗費時間）
            showResultCard(finalMonsterResult, currentUserName, currentElapsedSeconds);

            resultBox.classList.add('show');
            monsterCard.classList.add('animate-pop-flip');

            // 🔊 根據怪獸撥放對應 MP3 配音
            playMonsterMp3(finalMonsterResult);

            // 🎃 萬聖南瓜王特別彩蛋：蹦出全螢幕彩色綵帶
            if (finalMonsterResult.id === 'pumpkin') {
                setTimeout(triggerConfetti, 300);
            }

            setTimeout(() => {
                buttonGroup.classList.add('show');
            }, 1200);
        }

        function showResultCard(monster, userName, elapsedSeconds) {
            const imageBox = document.getElementById('monster-image-box');
            imageBox.style.borderColor = monster.bgColor || 'var(--primary-color)';

            if (monster.imageUrl && monster.imageUrl.trim() !== '') {
                imageBox.innerHTML = `
                    <img src="${monster.imageUrl}" 
                         class="monster-large-img" 
                         alt="${monster.name}" 
                         onerror="this.onerror=null; this.outerHTML='<div class=\\'monster-large-emoji\\'>🎃</div>';">
                `;
            } else {
                imageBox.innerHTML = `<div class="monster-large-emoji">🎃</div>`;
            }

            document.getElementById('res-user-name').innerText = userName;
            document.getElementById('res-monster-name').innerText = monster.name;
            document.getElementById('res-elapsed-time').innerText = `${elapsedSeconds} 秒`;
            document.getElementById('res-monster-desc').innerText = monster.phrase;
        }

        resetBtn.addEventListener("click", () => {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }

            monsterCard.classList.remove('animate-pop-flip');
            buttonGroup.classList.remove('show');
            resultBox.classList.remove('show');

            userNameInput.value = '';
            controlsRow.style.display = 'flex';
            camBox.style.display = 'block';
            
            updateScanBtnState();
        });

        // 下載卡片繪製：同時將變身秒數合成進圖檔
        downloadBtn.addEventListener("click", () => {
            if (!finalMonsterResult) return;

            const exportCanvas = document.getElementById('export-canvas');
            const ctx = exportCanvas.getContext('2d');
            
            exportCanvas.width = 600;
            exportCanvas.height = 920;

            // 背景底色
            ctx.fillStyle = "#190f26";
            ctx.fillRect(0, 0, 600, 920);

            // 卡片邊框
            ctx.strokeStyle = "#ff7300";
            ctx.lineWidth = 10;
            ctx.strokeRect(15, 15, 570, 890);

            // 頂部標題
            ctx.fillStyle = "#ff7300";
            ctx.font = "bold 34px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("🎃 萬聖節內心怪獸卡 🎃", 300, 65);

            // 正方形怪獸圖片
            const imgContainer = document.querySelector('#monster-image-box img');
            if (imgContainer && imgContainer.complete) {
                ctx.drawImage(imgContainer, 50, 90, 500, 500);
            } else {
                ctx.fillStyle = "#000000";
                ctx.fillRect(50, 90, 500, 500);
                ctx.fillStyle = "#ffffff";
                ctx.font = "100px sans-serif";
                ctx.fillText("🎃", 300, 370);
            }
            ctx.strokeStyle = "#8a2be2";
            ctx.lineWidth = 4;
            ctx.strokeRect(50, 90, 500, 500);

            ctx.textAlign = "left";
            
            // 宿主名字
            ctx.fillStyle = "#ff7300";
            ctx.font = "bold 24px sans-serif";
            ctx.fillText("怪獸宿主：", 50, 630);
            ctx.fillStyle = "#ffffff";
            ctx.font = "24px sans-serif";
            ctx.fillText(currentUserName, 180, 630);

            // 內心怪獸
            ctx.fillStyle = "#ff7300";
            ctx.font = "bold 24px sans-serif";
            ctx.fillText("內心怪獸：", 50, 675);
            ctx.fillStyle = "#ff9d00";
            ctx.font = "bold 26px sans-serif";
            ctx.fillText(finalMonsterResult.name, 180, 675);

            // 變身耗時 (即時計算秒數)
            ctx.fillStyle = "#ff7300";
            ctx.font = "bold 24px sans-serif";
            ctx.fillText("變身耗時：", 50, 720);
            ctx.fillStyle = "#ffff00";
            ctx.font = "bold 26px monospace";
            ctx.fillText(`${currentElapsedSeconds} 秒`, 180, 720);

            // 怪獸簡介
            ctx.fillStyle = "#ff7300";
            ctx.font = "bold 24px sans-serif";
            ctx.fillText("怪獸簡介：", 50, 765);
            ctx.fillStyle = "#f0e6d2";
            ctx.font = "italic 21px sans-serif";
            ctx.fillText(finalMonsterResult.phrase, 50, 805);

            // 底部活動文字
            ctx.fillStyle = "#8a2be2";
            ctx.font = "18px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("萬聖節特別企劃 — 內心怪獸測驗", 300, 875);

            const link = document.createElement('a');
            link.download = `${currentUserName}-內心怪獸-${finalMonsterResult.name}.png`;
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
        });

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initCamera);
        } else {
            initCamera();
        }
    </script>
</body>
</html>
